<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escape the Skyline Museum of Architecture</title>
<meta name="description" content="A 60-minute team escape room that introduces 9th graders to architecture as a career.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Josefin+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0e1319; --ink2:#161d26;
  --line:#e7eaee; --line-dim:rgba(231,234,238,.3);
  --paper:#f1f3f5; --paperink:#161c24;
  --lead:#ffc66e; --ok:#79d6a8; --bad:#ff9a88; --muted:#a5afba;
  --head:"Josefin Sans","Avenir Next","Century Gothic",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth; background:#0d1218}
body{
  margin:0; color:var(--line); font:16px/1.55 var(--body);
  background:radial-gradient(1300px 700px at 50% -8%,#2a3646 0%,#151c26 55%,#0d1218 100%) fixed; min-height:100vh;
}
h1,h2,h3{font-family:var(--head); font-weight:600; line-height:1.15; margin:0 0 .5em; letter-spacing:.01em}
h1{font-size:clamp(2.2rem,6vw,3.8rem); font-weight:500; letter-spacing:.015em}
h2{font-size:clamp(1.6rem,3.5vw,2.3rem)}
h3{font-size:1.25rem}
p{margin:0 0 .8em}
a{color:var(--lead)}
:focus-visible{outline:3px solid var(--lead); outline-offset:2px}
.wrap{max-width:1120px; margin:0 auto; padding:0 18px}

/* top bar */
.top{position:sticky; top:0; z-index:10; background:rgba(12,17,23,.96); border-bottom:1.5px solid var(--line-dim)}
.top .wrap{display:flex; flex-wrap:wrap; gap:8px 22px; align-items:center; justify-content:space-between; padding-top:10px; padding-bottom:10px}
.brand{font-family:var(--head); font-weight:700; font-size:1.05rem}
.stats{display:flex; gap:18px; align-items:center; flex-wrap:wrap; font-size:.95rem; color:var(--muted)}
.stats b{color:var(--line); font-weight:600}
#timer{font-family:var(--head); font-size:1.3rem; color:var(--lead); font-variant-numeric:tabular-nums}
#timer.late{color:var(--bad)}
.late-banner{background:var(--bad); color:#3a0b04; text-align:center; font-weight:600; padding:6px 12px}

/* layout */
.layout{display:grid; grid-template-columns:150px 1fr; gap:28px; padding-top:26px; padding-bottom:50px; align-items:start}
@media(max-width:820px){.layout{grid-template-columns:1fr}}

/* building section nav */
.section-nav{position:sticky; top:74px; display:flex; flex-direction:column; border:1.5px solid var(--line); background:rgba(16,22,30,.85)}
.section-nav .roof{height:22px; border-bottom:1.5px solid var(--line); background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line-dim) 6px 7px)}
.fl{padding:10px 10px 10px 12px; border-bottom:1.5px dashed var(--line-dim); font-size:.82rem; line-height:1.25; color:var(--muted); display:flex; gap:8px; align-items:center}
.fl:last-child{border-bottom:0}
.fl .n{font-family:var(--head); font-weight:700; font-size:1.4rem; width:1.1em; text-align:center; color:var(--muted)}
.fl.done{border-bottom-style:solid; color:var(--line)}
.fl.done .n{color:var(--ok)}
.fl.now{background:var(--lead); color:var(--ink); border-bottom-style:solid}
.fl.now .n{color:var(--ink)}
@media(max-width:820px){
  .section-nav{position:static; flex-direction:row-reverse}
  .section-nav .roof{display:none}
  .fl{flex:1; flex-direction:column; text-align:center; border-bottom:0; border-left:1.5px dashed var(--line-dim); padding:6px 2px}
  .fl .t{display:none}
  .fl:last-child{border-left:0}
}

/* panels */
.panel{border:1.5px solid var(--line-dim); background:rgba(16,22,30,.9); padding:20px 22px; margin-bottom:22px}
.story{font-size:1.08rem; max-width:68ch}
.floor-tag{color:var(--lead); font-family:var(--head); font-weight:700; margin-bottom:.3em}

/* gallery guide placards */
details.guide{margin-bottom:22px; border:1.5px solid var(--line-dim); background:rgba(16,22,30,.9)}
details.guide>summary{cursor:pointer; padding:14px 22px; font-family:var(--head); font-weight:700; font-size:1.2rem; list-style:none}
details.guide>summary::before{content:"▸"; display:inline-block; margin-right:10px; color:var(--lead); transition:transform .15s}
details.guide[open]>summary::before{transform:rotate(90deg)}
.placards{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; padding:4px 22px 22px}
.placard{background:var(--paper); color:var(--paperink); border-left:6px solid var(--lead); padding:12px 14px; font-size:.93rem; line-height:1.5}
.placard h4{font-family:var(--head); font-size:1.08rem; margin:0 0 .3em}
.placard p{margin:0}

/* puzzles */
.puzzle{border:1.5px solid var(--line); background:rgba(16,22,30,.94); padding:20px 22px; margin-bottom:22px}
.puzzle .ph{display:flex; justify-content:space-between; gap:12px; align-items:baseline; flex-wrap:wrap; margin-bottom:.4em}
.puzzle .ph .pn{color:var(--muted); font-size:.9rem}
.puzzle.solved{border-color:var(--ok); border-style:solid}
.puzzle.solved h3::after{content:" ✓"; color:var(--ok)}
.digit{display:inline-flex; align-items:center; gap:8px; background:var(--lead); color:var(--ink); padding:4px 12px; font-weight:600; font-family:var(--head); font-size:1.05rem}
.prompt{max-width:70ch}
.frow,.mrow{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,260px); gap:8px 16px; align-items:center; margin:10px 0}
@media(max-width:640px){.frow,.mrow{grid-template-columns:1fr}}
input[type=text],input[type=number],select{
  width:100%; font:inherit; color:var(--ink); background:#fff; border:2px solid transparent; padding:8px 10px; border-radius:0
}
input.ok{border-color:var(--ok)} input.no{border-color:var(--bad)}
.orderlist{list-style:none; padding:0; margin:12px 0; counter-reset:o}
.orderlist li{display:flex; justify-content:space-between; gap:12px; align-items:center; background:rgba(255,255,255,.07); border:1.5px solid var(--line-dim); padding:8px 10px; margin-bottom:6px; counter-increment:o}
.orderlist li .otext::before{content:counter(o) ". "; color:var(--lead); font-weight:600}
.obtns{display:flex; gap:4px}
.mini{font:inherit; width:34px; height:34px; background:transparent; color:var(--line); border:1.5px solid var(--line); cursor:pointer}
.mini:hover:not(:disabled){background:var(--line); color:var(--ink)}
.mini:disabled{opacity:.3; cursor:default}
.pickrow{display:flex; gap:10px; align-items:flex-start; padding:8px 10px; margin-bottom:6px; border:1.5px solid var(--line-dim); background:rgba(255,255,255,.07); cursor:pointer}
.pickrow input{margin-top:5px; width:18px; height:18px; accent-color:var(--lead)}
.actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px}
.btn{font:inherit; font-weight:600; background:var(--lead); color:var(--ink); border:2px solid var(--lead); padding:9px 18px; cursor:pointer}
.btn:hover{background:#ffe07d}
.btn.ghost{background:transparent; color:var(--line); border-color:var(--line-dim)}
.btn.ghost:hover{border-color:var(--line); background:rgba(255,255,255,.08)}
.msg{min-height:1.4em; margin-top:10px; font-weight:500}
.msg.good{color:var(--ok)} .msg.bad{color:var(--bad)}
.hints .hint{background:rgba(255,198,110,.12); border-left:4px solid var(--lead); padding:8px 12px; margin:8px 0 0; font-size:.95rem}
.reveal{background:rgba(121,214,168,.1); border-left:4px solid var(--ok); padding:8px 12px; margin-top:8px}
.cipher{font-family:var(--head); font-size:1.7rem; letter-spacing:.14em; background:rgba(255,255,255,.07); border:1.5px dashed var(--line-dim); padding:12px 16px; margin:12px 0; word-break:break-word}
.tablewrap{overflow-x:auto}
table.prog{border-collapse:collapse; margin:10px 0; background:var(--paper); color:var(--paperink)}
table.prog th,table.prog td{border:1px solid #9bb4cc; padding:6px 12px; text-align:left}
table.prog th{background:#dbe7f2}
.paper{background:#fbf9f3; color:var(--paperink); padding:12px; margin:12px 0; max-width:520px}
.paper svg{display:block; width:100%; height:auto}
.legend{font-size:.88rem; margin:6px 0 0}

/* gallery scene */
.scene-wrap{position:relative; border:1.5px solid var(--line); margin-bottom:22px; background:#0b1016; line-height:0; overflow:hidden}
.scene-wrap svg{display:block; width:100%; height:auto; min-height:190px; max-height:420px}
.scene-tag{position:absolute; left:50%; bottom:0; transform:translateX(-50%); background:var(--lead); color:var(--ink); font-family:var(--head); font-weight:700; padding:4px 18px; line-height:1.3; font-size:1rem; white-space:nowrap; pointer-events:none}
.rain{animation:rain 1.4s linear infinite}
@keyframes rain{from{transform:translate(0,-5px); opacity:.15}50%{opacity:.7}to{transform:translate(-2px,7px); opacity:.1}}
.flick{animation:flick 3.2s steps(1) infinite}
@keyframes flick{0%,100%{opacity:1}46%{opacity:.55}50%{opacity:1}}

/* difficulty */
.btn.lvl{font-size:.85rem; padding:6px 12px}
.setup{max-width:1120px; margin:0 auto; padding:0 18px 60px}
.lvlgrid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin:14px 0}
@media(max-width:900px){.lvlgrid{grid-template-columns:1fr}}
.lvlcard{display:flex; flex-direction:column; gap:7px; border:2px solid var(--line-dim); background:rgba(255,255,255,.05); padding:14px 16px; cursor:pointer; position:relative}
.lvlcard:hover{border-color:var(--line)}
.lvlcard input{position:absolute; opacity:0; width:1px; height:1px}
.lvlcard.sel{border-color:var(--lead); background:rgba(255,198,110,.1)}
.lvlcard:focus-within{outline:3px solid var(--lead); outline-offset:2px}
.lvlname{font-family:var(--head); font-weight:700; font-size:1.5rem; line-height:1.1}
.lvlclock{font-family:var(--head); font-weight:700; font-size:1.05rem; padding:2px 10px; align-self:flex-start; color:var(--ink)}
.lvlclock.fast{background:#ff9a88} .lvlclock.norm{background:#ffc66e} .lvlclock.slow{background:#79d6a8}
.lvltag{color:var(--muted); font-size:.92rem}
.lvlcard ul{margin:4px 0 0; padding-left:1.1em; font-size:.93rem}
.lvlcard li{margin-bottom:.3em}
.modal{position:fixed; inset:0; background:rgba(5,8,12,.82); z-index:60; display:flex; align-items:flex-start; justify-content:center; padding:28px 14px; overflow:auto}
.modal .box{width:100%; max-width:1020px; background:#141b25; border:1.5px solid var(--line); padding:22px 24px}
.certnote{font-size:.92rem; margin-top:14px}

/* lessons */
.lesson .juno{font-family:var(--head); font-size:1.12rem; line-height:1.45; border-left:4px solid var(--lead); padding:2px 0 2px 12px; margin:0 0 14px}
.lesson h4{font-family:var(--head); font-size:1.1rem; margin:1.1em 0 .35em}
.lesson h5{font-family:var(--head); font-size:1rem; margin:.5em 0 .25em}
.fact{background:#e6f0ff; border-left:4px solid #4a7bd0; padding:8px 12px; margin:14px 0}
.cabinlink{background:#fff1d4; border-left:4px solid #e69a2e; padding:8px 12px; margin:14px 0}
.visbox{margin:8px 0 14px; overflow-x:auto}
svg.vis{display:block; max-width:min(100%,540px); height:auto; margin:0 auto; background:#fbf9f3; border:1px solid #c9d1d9}
svg.vis.wide{min-width:560px; max-width:100%; background:#16202b}
.bcards{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; margin:10px 0}
.bc{background:#fff; border:1px solid #c9d1d9; padding:10px}
.bc p{margin:.3em 0; font-size:.92rem}
.bicon{width:100%; height:auto; display:block}
.phases{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; margin:10px 0}
.phc{background:#fff; border:1px solid #c9d1d9; border-left:4px solid #4a7bd0; padding:8px 12px}
.phc p{margin:.2em 0; font-size:.92rem}
table.info{border-collapse:collapse; margin:8px 0; background:#fff; font-size:.92rem}
table.info th,table.info td{border:1px solid #b6c0ca; padding:6px 10px; text-align:left; vertical-align:top}
table.info th{background:#e3ebf3}
.symrow{display:flex; flex-wrap:wrap; gap:12px; margin:8px 0}
.symrow figure{margin:0; text-align:center; background:#fbf9f3; border:1px solid #c9d1d9; padding:6px 8px}
.symrow figcaption{font-size:.85rem; margin-top:2px}
.skillnote{background:rgba(121,214,168,.12); border-left:4px solid var(--ok); padding:8px 12px}

/* cabin studio */
.layout.one{grid-template-columns:1fr}
.studio{display:grid; grid-template-columns:minmax(0,1fr) 350px; gap:20px; align-items:start; margin-bottom:30px}
@media(max-width:1000px){.studio{grid-template-columns:1fr}}
.planbox{background:#fbf9f3; border:1.5px solid var(--line)}
.planbox svg{display:block; width:100%; height:auto; touch-action:none; user-select:none}
.ctl{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px}
.ctl .zt{color:var(--muted); display:flex; align-items:center; gap:6px}
.ctl .btn[disabled]{opacity:.4; cursor:default}
.muted{color:var(--muted)}
.tray{margin-bottom:14px}
.partrow{width:100%; display:flex; gap:10px; align-items:center; text-align:left; font:inherit; color:var(--line); background:rgba(255,255,255,.06); border:1.5px solid var(--line-dim); padding:6px 10px; margin-bottom:6px; cursor:pointer}
.partrow:hover{border-color:var(--lead)}
.partrow.placed{border-color:var(--ok)}
.partrow .pi{background:#fbf9f3; padding:3px; width:50px; min-height:42px; display:flex; align-items:center; justify-content:center; flex:none}
.partrow .pi.dw{font-family:var(--head); font-weight:700; color:var(--ink); font-size:.8rem}
.partrow .pt small{display:block; color:var(--muted)}
.chk{list-style:none; padding:0; margin:0}
.chk li{padding:8px 10px; border-left:4px solid; margin-bottom:8px; background:rgba(255,255,255,.05)}
.chk li.ok{border-color:var(--ok)} .chk li.no{border-color:var(--bad)}
.chk p{margin:.3em 0; color:var(--bad)}
.chk small{display:block; color:var(--muted)}
.confetti{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:30}
.confetti span{position:absolute; top:-20px; width:9px; height:15px; animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media(prefers-reduced-motion:reduce){.confetti{display:none}}

/* task fact box */
.ref{background:var(--paper); color:var(--paperink); border-left:6px solid var(--lead); margin-bottom:18px}
.ref>summary{cursor:pointer; padding:12px 16px; font-family:var(--head); font-weight:700; font-size:1.15rem; list-style:none}
.ref>summary::before{content:"\25B8"; display:inline-block; margin-right:10px; transition:transform .15s}
.ref[open]>summary::before{transform:rotate(90deg)}
.refbody{padding:0 18px 14px; font-size:.97rem; line-height:1.55; max-width:78ch}
.refbody p{margin:0 0 .7em}
.refbody ul,.refbody ol{margin:0 0 .8em; padding-left:1.3em}
.refbody li{margin-bottom:.35em}
.refbody a{color:#7a4a00}
table.cz{border-collapse:collapse; font-family:var(--head); font-size:.9rem; margin:6px 0 10px}
table.cz th{text-align:left; padding:3px 10px 3px 0; white-space:nowrap}
table.cz td{border:1px solid #9aa5b1; padding:2px 5px; text-align:center; min-width:22px}
table.cz tr:first-child td{background:#ffe3b0}
table.cz tr:last-child td{background:#e3ebf3; font-weight:700}

/* drawing-sheet title block */
.scene-wrap.flush{margin-bottom:0}
.titleblock{display:grid; grid-template-columns:1.7fr .9fr 1.5fr .9fr .9fr; border:1.5px solid var(--line); border-top:1px solid var(--line-dim); margin-bottom:22px; background:rgba(14,19,25,.94)}
.titleblock>div{padding:7px 14px; border-left:1px solid var(--line-dim); min-width:0}
.titleblock>div:first-child{border-left:0}
.titleblock small{display:block; color:var(--muted); font-size:.74rem; line-height:1.2}
.titleblock span{display:block; font-family:var(--head); font-weight:600; font-size:.92rem; line-height:1.3}
@media(max-width:700px){.titleblock{grid-template-columns:1fr 1fr}.titleblock>div:nth-child(odd){border-left:0}.titleblock>div:nth-child(n+3){border-top:1px solid var(--line-dim)}}

/* hotspots */
.hot{cursor:pointer; outline:none}
.hot .hr{fill:rgba(255,198,110,.04); stroke:#ffc66e; stroke-width:2; stroke-dasharray:6 4}
.hot:hover .hr,.hot:focus-visible .hr{fill:rgba(255,198,110,.22)}
.hot:focus-visible .hr{stroke:#fff; stroke-width:3}
.hot.done .hr{stroke:#6fd3a0; fill:rgba(121,214,168,.08)}
.hot.key .hr{stroke:#ff8f7e}
.hot.key.done .hr{stroke:#6fd3a0}
.hot .badge circle{fill:#ffc66e; stroke:#0e1319; stroke-width:2.5}
.hot.done .badge circle{fill:#6fd3a0}
.hot .badge text{fill:#0e1319; font:700 16px "Josefin Sans",sans-serif; text-anchor:middle; dominant-baseline:central}
.hot.todo .badge{animation:pulse 2.2s ease-in-out infinite; transform-box:fill-box; transform-origin:center}
@keyframes pulse{50%{transform:scale(1.2)}}
.hot .lab{opacity:0; pointer-events:none; transition:opacity .15s}
.hot:hover .lab,.hot:focus-visible .lab{opacity:1}
.hot .lab rect{fill:#0e1319; stroke:#ffc66e; stroke-width:1.5}
.hot .lab text{fill:#ffc66e; font:600 12px "IBM Plex Sans",sans-serif; text-anchor:middle; dominant-baseline:central}
.scenehint{margin:-8px 0 20px; color:var(--muted)}
.scenehint b{color:var(--lead)}
.tasklist{list-style:none; padding:0; margin:12px 0 0; display:grid; gap:8px}
.taskbtn{width:100%; display:grid; grid-template-columns:38px 1fr auto; gap:12px; align-items:center; text-align:left; font:inherit; color:var(--line); background:rgba(255,255,255,.06); border:1.5px solid var(--line-dim); padding:10px 12px; cursor:pointer}
.taskbtn:hover{border-color:var(--lead)}
.taskbtn .tn{font-family:var(--head); font-weight:700; font-size:1.3rem; background:var(--lead); color:var(--ink); width:34px; height:34px; display:flex; align-items:center; justify-content:center}
.taskbtn.done .tn{background:var(--ok)}
.taskbtn .ts{color:var(--muted); font-size:.9rem}
.page{max-width:860px; margin:0 auto; padding:22px 18px 50px}
.page .crumbs{margin-bottom:14px}
.after{margin-top:18px}

/* lock */
.lock{border:2px solid var(--lead); background:rgba(16,22,30,.96); padding:22px}
.digits{display:flex; gap:10px; margin:12px 0; flex-wrap:wrap}
.dg{width:66px; height:76px; border:1.5px dashed var(--line-dim); display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--muted)}
.dg small{font-size:.78rem}
.dg b{font-family:var(--head); font-size:2rem; line-height:1}
.dg.on{border-style:solid; border-color:var(--lead); color:var(--lead)}
.codein{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px}
.codein input{width:150px; font-family:var(--head); font-size:1.6rem; letter-spacing:.3em; text-align:center}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* start / transition / win */
.hero{display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr); gap:34px; align-items:center; padding:46px 0}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.hero p.lead{font-size:1.15rem; max-width:56ch}
.rules{padding-left:1.1em; max-width:60ch}
.rules li{margin-bottom:.4em}
.teamrow{display:flex; gap:10px; flex-wrap:wrap; margin:18px 0 6px}
.teamrow input{max-width:300px}
.keycards{display:flex; gap:10px; margin:14px 0; flex-wrap:wrap}
.kc{width:62px; height:78px; background:var(--paper); color:var(--ink); border-left:6px solid var(--lead); display:flex; align-items:center; justify-content:center; font-family:var(--head); font-weight:700; font-size:2rem}
.kc.empty{background:transparent; color:var(--muted); border:1.5px dashed var(--line-dim); border-left:1.5px dashed var(--line-dim)}
.center{max-width:720px; margin:40px auto}
.cert{background:var(--paper); color:var(--paperink); padding:34px 30px; border:6px double var(--ink); text-align:center; margin:22px 0}
.cert h2{color:var(--ink)}
.cert .big{font-family:var(--head); font-size:2rem; font-weight:700; margin:.2em 0}
.two{display:grid; grid-template-columns:1fr 1fr; gap:22px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.foot{border-top:1.5px solid var(--line-dim); background:rgba(12,17,23,.96); padding:12px 0; position:sticky; bottom:0}
.foot .wrap{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.foot .kc{width:34px; height:42px; font-size:1.2rem; border-left-width:4px}
.foot span.lbl{color:var(--muted); font-size:.9rem}

@media(max-width:640px){.foot{position:static}}
@media print{
  body{background:#fff}
  body *{visibility:hidden}
  .cert,.cert *{visibility:visible}
  .cert{position:absolute; left:0; top:0; width:100%; margin:0}
}

<script>
/* ============================================================

const MUSEUM = "Skyline Museum of Architecture";
const TARGET_MIN = 75;

const FLOOR_PLAN_SVG = `
<svg viewBox="0 0 440 290" role="img" aria-label="Floor plan of a small house with three rooms: a living room on the left, a bedroom top right, and a bathroom bottom right">

/* ============================================================
   CABIN DESIGN STUDIO (final challenge)
   Plan units are feet. The cabin interior is 24 ft wide (east-west)
   by 16 ft deep (north-south). North is up; the south wall is the bottom.
   ============================================================ */
const CAB={W:24,H:16};
const PARTS={
  pod:{n:"Bathroom pod",short:"",w:6,h:8,zd:2.5,zw:2.5,req:1,dim:"6 ft × 8 ft",tip:"A ready-made bathroom with toilet, sink, and shower. Its sliding door is on the side that has the clear-space zone."},
  bed:{n:"Queen bed",short:"Bed",w:5,h:6.5,zd:2,req:1,dim:"5 ft × 6.5 ft",tip:"Needs 2 ft free at the foot so you can walk up to it and make it."},
  wardrobe:{n:"Wardrobe",short:"Closet",w:3,h:2,zd:2.5,req:1,dim:"3 ft × 2 ft",tip:"You need room to open the doors and stand in front."},
  fridge:{n:"Refrigerator",short:"Fridge",w:2.5,h:2.5,zd:3,req:1,dim:"2.5 ft × 2.5 ft",tip:"Needs about 3 ft in front so the door can open and you can stand."},
  stove:{n:"Cooktop and oven",short:"Stove",w:2.5,h:2.5,zd:3,req:1,dim:"2.5 ft × 2.5 ft",tip:"Needs about 3 ft in front for safe cooking."},
  sink:{n:"Kitchen sink cabinet",short:"Sink",w:3,h:2,zd:3,req:1,dim:"3 ft × 2 ft",tip:"Needs about 3 ft in front to stand and work."},
  dining:{n:"Dining table + 2 chairs",short:"Dining",w:5,h:3,zd:0,req:1,dim:"5 ft × 3 ft",tip:"The chairs are tucked in at both ends."},
  love:{n:"Loveseat",short:"Sofa",w:5.5,h:3,zd:2,req:1,dim:"5.5 ft × 3 ft",tip:"Needs 2 ft in front for legs and walking past."},
  desk:{n:"Desk",short:"Desk",w:4,h:2,zd:2.5,req:1,dim:"4 ft × 2 ft",tip:"Needs 2.5 ft in front for a chair and for sitting down."},
  wood:{n:"Wood stove",short:"Wood stove",w:2.5,h:2.5,zd:3,req:1,dim:"2.5 ft × 2.5 ft",tip:"Hot! Keep it at least 3 ft from every other piece, with 3 ft clear in front."},
  chair:{n:"Armchair (bonus)",short:"Chair",w:3,h:3,zd:2,req:0,dim:"3 ft × 3 ft",tip:"Optional. If you add it, it has to follow the same rules."}
};
const SK="#2b333d";
const ICON={
  bed:(w,h)=>`<rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx=".2" fill="#f1e6d2" stroke="${SK}" stroke-width=".1"/><rect x="${-w/2+.3}" y="${-h/2+.3}" width="${w/2-.45}" height="1.3" rx=".35" fill="#fff" stroke="${SK}" stroke-width=".07"/><rect x=".15" y="${-h/2+.3}" width="${w/2-.45}" height="1.3" rx=".35" fill="#fff" stroke="${SK}" stroke-width=".07"/><path d="M${-w/2} ${-h/2+2.3}H${w/2}" stroke="${SK}" stroke-width=".07"/>`,
  wardrobe:(w,h)=>`<rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" fill="#dcc7a4" stroke="${SK}" stroke-width=".1"/><path d="M${-w/2} ${-h/2}L${w/2} ${h/2}M${w/2} ${-h/2}L${-w/2} ${h/2}" stroke="${SK}" stroke-width=".06"/>`,
  fridge:(w,h)=>`<rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx=".1" fill="#e6edf3" stroke="${SK}" stroke-width=".1"/><path d="M${-w/2} ${-h/2+.9}H${w/2}" stroke="${SK}" stroke-width=".07"/><rect x="${w/2-.35}" y="${-h/2+.15}" width=".12" height=".5" fill="${SK}"/><rect x="${w/2-.35}" y="${-h/2+1.1}" width=".12" height=".9" fill="${SK}"/>`,
  stove:(w,h)=>`<rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx=".1" fill="#dfe3e8" stroke="${SK}" stroke-width=".1"/>${[[-1,-1],[1,-1],[-1,1],[1,1]].map(([a,b])=>`<circle cx="${a*w/4}" cy="${b*h/4}" r=".32" fill="#3b4048" stroke="${SK}" stroke-width=".05"/><circle cx="${a*w/4}" cy="${b*h/4}" r=".14" fill="#8a93a0"/>`).join("")}`,
  sink:(w,h)=>`<rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" fill="#e6edf3" stroke="${SK}" stroke-width=".1"/><rect x="${-w/2+.35}" y="${-h/2+.3}" width="${w-.7}" height="${h-.6}" rx=".3" fill="#b8d4ea" stroke="${SK}" stroke-width=".07"/><circle cx="0" cy="${-h/2+.28}" r=".13" fill="${SK}"/>`,
  dining:(w,h)=>`<rect x="${-w/2+1}" y="${-h/2}" width="${w-2}" height="${h}" rx=".15" fill="#d9b98a" stroke="${SK}" stroke-width=".1"/><rect x="${-w/2+.05}" y="-.6" width=".9" height="1.2" rx=".25" fill="#c49a6c" stroke="${SK}" stroke-width=".07"/><rect x="${w/2-.95}" y="-.6" width=".9" height="1.2" rx=".25" fill="#c49a6c" stroke="${SK}" stroke-width=".07"/>`,
  love:(w,h)=>`<rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx=".25" fill="#b9c7d9" stroke="${SK}" stroke-width=".1"/><rect x="${-w/2}" y="${-h/2}" width="${w}" height=".8" rx=".25" fill="#9fb1c8" stroke="${SK}" stroke-width=".07"/><rect x="${-w/2+.1}" y="${-h/2+.9}" width=".7" height="${h-1}" rx=".2" fill="#9fb1c8" stroke="${SK}" stroke-width=".07"/><rect x="${w/2-.8}" y="${-h/2+.9}" width=".7" height="${h-1}" rx=".2" fill="#9fb1c8" stroke="${SK}" stroke-width=".07"/><path d="M0 ${-h/2+.9}V${h/2-.1}" stroke="${SK}" stroke-width=".06"/>`,
  chair:(w,h)=>`<rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx=".3" fill="#c8d8c0" stroke="${SK}" stroke-width=".1"/><rect x="${-w/2}" y="${-h/2}" width="${w}" height=".7" rx=".25" fill="#a9c09e" stroke="${SK}" stroke-width=".07"/>`,
  desk:(w,h)=>`<rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx=".1" fill="#d9b98a" stroke="${SK}" stroke-width=".1"/><rect x="-.7" y="${-h/2+.2}" width="1.4" height=".9" rx=".08" fill="#59626b" stroke="${SK}" stroke-width=".06"/>`,
  wood:(w,h)=>`<rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx=".2" fill="#4a4f57" stroke="${SK}" stroke-width=".1"/><circle cx="0" cy=".05" r=".7" fill="#c4cad2" stroke="${SK}" stroke-width=".07"/><circle cx="0" cy="${-h/2+.45}" r=".22" fill="#e5483a"/>`,
  pod:(w,h)=>`<rect x="${-w/2+.17}" y="${-h/2+.17}" width="${w-.34}" height="${h-.34}" fill="#f4f7fa" stroke="${SK}" stroke-width=".34"/>`+
    `<rect x="-2.65" y="-3.65" width="3" height="3" fill="#cfe6f5" stroke="${SK}" stroke-width=".08"/><path d="M-2.65 -3.65L.35 -.65M.35 -3.65L-2.65 -.65" stroke="${SK}" stroke-width=".05"/><circle cx="-1.15" cy="-2.15" r=".2" fill="${SK}"/>`+
    `<rect x="1.15" y="-3.6" width="1.2" height=".6" rx=".1" fill="#fff" stroke="${SK}" stroke-width=".08"/><ellipse cx="1.75" cy="-2.55" rx=".55" ry=".75" fill="#fff" stroke="${SK}" stroke-width=".08"/>`+
    `<rect x="1.9" y=".2" width="1" height="2" fill="#fff" stroke="${SK}" stroke-width=".08"/><ellipse cx="2.4" cy="1.2" rx=".32" ry=".6" fill="#cfe6f5" stroke="${SK}" stroke-width=".06"/>`+
    `<rect x="-1.25" y="${h/2-.4}" width="2.5" height=".46" fill="#fbf9f3"/><path d="M-1.25 ${h/2-.17}H0" stroke="${SK}" stroke-width=".1"/>`
};
function iconSVG(k,px){const p=PARTS[k];return `<svg viewBox="${-p.w/2-.2} ${-p.h/2-.2} ${p.w+.4} ${p.h+.4}" width="${px}" height="${f1(px*(p.h+.4)/(p.w+.4))}" aria-hidden="true">${ICON[k](p.w,p.h)}</svg>`;}
function f1(n){return Math.round(n*10)/10;}

/* ----- geometry ----- */
const cabin=()=>S.cabin||(S.cabin={items:[],ops:[]});
const dimsOf=it=>{const p=PARTS[it.k];return it.r%180?[p.h,p.w]:[p.w,p.h];};
const bodyBox=it=>{const [w,h]=dimsOf(it);return{x1:it.x-w/2,y1:it.y-h/2,x2:it.x+w/2,y2:it.y+h/2};};
const rot90=(vx,vy,r)=>{const a=r*Math.PI/180,c=Math.round(Math.cos(a)),s=Math.round(Math.sin(a));return[vx*c-vy*s,vx*s+vy*c];};
const zoneBox=it=>{const p=PARTS[it.k]; if(!p.zd) return null; const zw=p.zw||p.w, a=rot90(-zw/2,p.h/2,it.r), b=rot90(zw/2,p.h/2+p.zd,it.r);
  return{x1:it.x+Math.min(a[0],b[0]),x2:it.x+Math.max(a[0],b[0]),y1:it.y+Math.min(a[1],b[1]),y2:it.y+Math.max(a[1],b[1])};};
const hit=(a,b)=>a.x1<b.x2-1e-6&&a.x2>b.x1+1e-6&&a.y1<b.y2-1e-6&&a.y2>b.y1+1e-6;
const gapBox=(a,b)=>Math.hypot(Math.max(0,b.x1-a.x2,a.x1-b.x2),Math.max(0,b.y1-a.y2,a.y1-b.y2));
const inBounds=b=>b.x1>=-1e-6&&b.y1>=-1e-6&&b.x2<=CAB.W+1e-6&&b.y2<=CAB.H+1e-6;
const opPoint=o=>o.side==="S"?[o.pos,CAB.H]:o.side==="N"?[o.pos,0]:o.side==="W"?[0,o.pos]:[CAB.W,o.pos];
const landing=o=>{const [x,y]=opPoint(o);return o.side==="S"?{x1:x-1.5,x2:x+1.5,y1:y-3,y2:y}:o.side==="N"?{x1:x-1.5,x2:x+1.5,y1:y,y2:y+3}:o.side==="W"?{x1:x,x2:x+3,y1:y-1.5,y2:y+1.5}:{x1:x-3,x2:x,y1:y-1.5,y2:y+1.5};};
const nm=it=>PARTS[it.k].n;

function reachInfo(c){
  const door=c.ops.find(o=>o.k==="door"); if(!door) return {ok:false,names:["the front door is not placed"]};
  const N=2,nx=CAB.W*N,ny=CAB.H*N,blocked=new Uint8Array(nx*ny);
  c.items.forEach(it=>{const b=bodyBox(it);for(let i=Math.floor(b.x1*N+1e-6);i<Math.ceil(b.x2*N-1e-6);i++)for(let j=Math.floor(b.y1*N+1e-6);j<Math.ceil(b.y2*N-1e-6);j++)if(i>=0&&j>=0&&i<nx&&j<ny)blocked[j*nx+i]=1;});
  const L=landing(door), cell=(x,y)=>[Math.min(nx-1,Math.max(0,Math.floor(x*N))),Math.min(ny-1,Math.max(0,Math.floor(y*N)))];
  const [sx,sy]=cell((L.x1+L.x2)/2,(L.y1+L.y2)/2);
  if(blocked[sy*nx+sx]) return {ok:false,names:["the space just inside the front door is blocked"]};
  const seen=new Uint8Array(nx*ny),q=[[sx,sy]];seen[sy*nx+sx]=1;
  while(q.length){const [x,y]=q.pop();[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const a=x+dx,b=y+dy;if(a>=0&&b>=0&&a<nx&&b<ny&&!blocked[b*nx+a]&&!seen[b*nx+a]){seen[b*nx+a]=1;q.push([a,b]);}});}
  const bad=[];
  c.items.forEach(it=>{const z=zoneBox(it);if(!z)return;const cx=(z.x1+z.x2)/2,cy=(z.y1+z.y2)/2;if(cx<0||cy<0||cx>=CAB.W||cy>=CAB.H)return;const [a,b]=cell(cx,cy);if(!seen[b*nx+a])bad.push(nm(it));});
  return {ok:!bad.length,names:bad};
}

function runChecks(c){
  const R=[],add=(ok,t,m,why)=>R.push({ok,t,m,why});
  const items=c.items,ops=c.ops,by=k=>items.find(i=>i.k===k);
  const door=ops.find(o=>o.k==="door"),wins=ops.filter(o=>o.k==="win");
  /* 1 placed */
  const miss=Object.keys(PARTS).filter(k=>PARTS[k].req&&!by(k)).map(k=>PARTS[k].n);
  if(!door) miss.push("front door"); if(wins.length<3) miss.push(wins.length===2?"1 more window":(3-wins.length)+" more windows");
  add(!miss.length,"Every required piece is in the plan",`Still to place: ${miss.join(", ")}.`,"A plan has to match the client's program, the list of what they asked for.");
  /* 2 overlaps */
  const over=[];
  for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++)if(hit(bodyBox(items[i]),bodyBox(items[j])))over.push(`${nm(items[i])} and ${nm(items[j])}`);
  const sides={};ops.forEach(o=>{(sides[o.side]=sides[o.side]||[]).push(o);});
  Object.values(sides).forEach(a=>{for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++)if(Math.abs(a[i].pos-a[j].pos)<3)over.push("two openings on the same wall");});
  add(!over.length,"Nothing overlaps",`These collide: ${[...new Set(over)].join("; ")}.`,"Two things cannot be in the same place. Scale drawings catch this before anything is built.");
  /* 3 front door */
  if(door){const L=landing(door),blockers=items.filter(it=>hit(bodyBox(it),L)).map(nm);
    add(!blockers.length,"The front door opens freely",`The door swing and landing (a 3 ft square inside the door) is blocked by: ${blockers.join(", ")}.`,"A door needs room to swing, and people need a place to stand while they open it.");}
  else add(false,"The front door opens freely","Place the front door on an outside wall first.","Every building needs a main entrance.");
  /* 4 clearance zones */
  const zbad=[];items.forEach(it=>{const z=zoneBox(it);if(!z)return;
    if(!inBounds(z)){zbad.push(`${nm(it)} (its front faces a wall or the edge of the cabin)`);return;}
    const o=items.filter(x=>x!==it&&hit(z,bodyBox(x))).map(nm);if(o.length)zbad.push(`${nm(it)} (${o.join(", ")} is in the way)`);});
  add(!zbad.length,"Each piece has room to use it",`Not enough clear space in front of: ${zbad.join("; ")}.`,"Dashed orange zones show the clear floor people need in front of each piece. These are called clearances.");
  /* 5 wood stove */
  const ws=by("wood");
  if(ws){const near=items.filter(x=>x!==ws&&gapBox(bodyBox(ws),bodyBox(x))<3-1e-6).map(nm);
    add(!near.length,"The wood stove is a safe 3 ft from everything else",`Too close to the stove: ${near.join(", ")}. Keep at least 3 ft between the stove and anything else.`,"Hot surfaces can ignite nearby furniture, so safety codes require clearance. This is the Strength part of Vitruvius's test.");}
  else add(false,"The wood stove is a safe 3 ft from everything else","Place the wood stove.","Safety first.");
  /* 6 south windows */
  const south=wins.filter(w=>w.side==="S").length;
  add(south>=2,"At least 2 windows face south",`Only ${south} south window${south===1?"":"s"}. The south wall is the bottom wall, where the winter sun shines in.`,"In the Northern Hemisphere, south windows bring in free heat and light in winter.");
  /* 7 quiet bed */
  const bed=by("bed"),st=by("stove");
  if(bed&&st){const d=gapBox(bodyBox(bed),bodyBox(st));add(d>=8-1e-6,"The bed is at least 8 ft from the stove",`The bed is only ${f1(d)} ft from the stove. Noise, smells, and heat from cooking travel.`,"Architects keep quiet, private areas away from busy, noisy ones. This is called zoning.");}
  else add(false,"The bed is at least 8 ft from the stove","Place the bed and the stove.","Zoning.");
  /* 8 plumbing */
  const sk=by("sink"),pod=by("pod");
  if(sk&&pod){const d=gapBox(bodyBox(sk),bodyBox(pod));add(d<=10+1e-6,"The kitchen sink is within 10 ft of the bathroom",`The sink is ${f1(d)} ft from the bathroom pod. Move them closer so they can share pipes.`,"Pipes cost money and can leak. Grouping wet rooms, such as kitchens and baths, saves pipe. Builders call it a wet wall.");}
  else add(false,"The kitchen sink is within 10 ft of the bathroom","Place the sink cabinet and the bathroom pod.","Wet rooms together.");
  /* 9 fire escape */
  if(bed){const bb=bodyBox(bed),ok=wins.some(w=>{const [x,y]=opPoint(w);return gapBox(bb,{x1:x,x2:x,y1:y,y2:y})<=6+1e-6;});
    add(ok,"There is a window within 6 ft of the bed","No window is close to the bed. Move a window or the bed.","Building codes require that sleeping areas have a window that can be used as an emergency exit.");}
  else add(false,"There is a window within 6 ft of the bed","Place the bed.","Emergency exit.");
  /* 10 reachable */
  const r=reachInfo(c);
  add(r.ok,"You can walk from the front door to everything",`You cannot reach: ${r.names.join(", ")}. Furniture is walling something off.`,"Circulation means how people move through a building. A design is only good if you can get to everything.");
  return R;
}

/* ----- drawing ----- */
function planSVG(c,sel,zones,flagged){
  const W=CAB.W,H=CAB.H,m=2.4; const lines=[];
  let o=`<svg id="plan" viewBox="${-m} ${-m} ${W+2*m} ${H+2*m}" role="img" aria-label="Floor plan canvas for the cabin, 24 feet by 16 feet. One grid square is one foot.">`;
  o+=`<rect x="${-m}" y="${-m}" width="${W+2*m}" height="${H+2*m}" fill="#fbf9f3"/>`;
  o+=`<rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/>`;
  for(let i=0;i<=W;i++)o+=`<line x1="${i}" y1="0" x2="${i}" y2="${H}" stroke="#16202b" stroke-opacity="${i%5===0?.22:.09}" stroke-width="${i%5===0?.06:.03}"/>`;
  for(let j=0;j<=H;j++)o+=`<line x1="0" y1="${j}" x2="${W}" y2="${j}" stroke="#16202b" stroke-opacity="${j%5===0?.22:.09}" stroke-width="${j%5===0?.06:.03}"/>`;
  c.items.forEach(it=>{const z=zoneBox(it);if(z&&zones){const bad=flagged.has(it.k+"z");o+=`<rect x="${z.x1}" y="${z.y1}" width="${z.x2-z.x1}" height="${z.y2-z.y1}" fill="${bad?"#ff6b5a":"#ffb347"}" fill-opacity=".22" stroke="${bad?"#d6382a":"#e69a2e"}" stroke-width=".08" stroke-dasharray=".35 .25"/>`;}});
  o+=`<path fill-rule="evenodd" d="M-.5 -.5H${W+.5}V${H+.5}H-.5Z M0 0V${H}H${W}V0Z" fill="#1b222b"/>`;
  c.ops.forEach(op=>{
    const [x,y]=opPoint(op),a=op.side==="S"?0:op.side==="N"?180:op.side==="W"?90:-90,hx=op.flip?1.5:-1.5,dir=op.flip?-1:1,s=sel===op.id;
    o+=`<g class="opn" data-id="${op.id}" transform="translate(${x} ${y}) rotate(${a})" style="cursor:grab">`;
    if(op.k==="door") o+=`<rect x="-1.5" y="-.02" width="3" height=".54" fill="#fff"/><line x1="${hx}" y1="0" x2="${hx}" y2="-3" stroke="#1b222b" stroke-width=".16"/><path d="M${hx} -3A3 3 0 0 ${op.flip?0:1} ${hx+3*dir} 0" fill="rgba(80,140,220,.07)" stroke="#1b222b" stroke-width=".06" stroke-dasharray=".2 .15"/>`;
    else o+=`<rect x="-1.5" y="-.02" width="3" height=".54" fill="#cfe6ff" stroke="#1b222b" stroke-width=".07"/><line x1="-1.5" y1=".25" x2="1.5" y2=".25" stroke="#1b222b" stroke-width=".05"/>`;
    o+=`<rect x="-1.5" y="-.6" width="3" height="1.4" fill="transparent" ${s?`stroke="#2b6de0" stroke-width=".12" stroke-dasharray=".25 .15"`:""}/></g>`;
  });
  const order=[...c.items].sort((a,b)=>(a.k===sel)-(b.k===sel));
  order.forEach(it=>{const b=bodyBox(it),p=PARTS[it.k],s=sel===it.k,bad=flagged.has(it.k);
    o+=`<g class="itm" data-id="${it.k}" style="cursor:grab"><g transform="translate(${it.x} ${it.y}) rotate(${it.r})">${ICON[it.k](p.w,p.h)}</g>`;

const CHEAT=`
<p>Everything you need is here. Real architects use these same ideas every day.</p>
<h4>1. Pieces and sizes</h4>
<p>The studio draws everything at true size: <b>1 grid square = 1 foot</b>. Queen bed 5 ft × 6.5 ft. Wardrobe 3 × 2. Refrigerator 2.5 × 2.5. Cooktop 2.5 × 2.5. Sink cabinet 3 × 2. Dining table with chairs 5 × 3. Loveseat 5.5 × 3. Desk 4 × 2. Wood stove 2.5 × 2.5. Bathroom pod 6 × 8. Doors and windows are 3 ft wide.</p>
<h4>2. Clearances (the dashed orange zones)</h4>
<p>People need floor space to use furniture. Every piece except the dining set has a <b>front</b>, and the clear zone in front of it (2 to 3 ft deep) must stay empty of other furniture and must not run into a wall. Rotate a piece to change which way it faces. <b>Kitchen pieces and the wood stove need 3 ft. The bathroom pod door needs 2.5 ft. The bed needs 2 ft at its foot. The desk and wardrobe need 2.5 ft. The loveseat needs 2 ft.</b></p>
<h4>3. The front door</h4>
<p>A door swings open into a 3 ft by 3 ft square just inside the wall. Keep that landing clear. Click the door and use <b>Flip door swing</b> to choose the hinge side.</p>
<h4>4. Fire safety</h4>
<p>Keep the wood stove <b>at least 3 ft from every other piece</b>. Also place a window within <b>6 ft of the bed</b> so there is an emergency exit.</p>
<h4>5. Sun</h4>
<p>North is up. The sun is in the south, so <b>at least 2 windows should be on the south (bottom) wall</b> to bring in light and free heat in winter.</p>
<h4>6. Zoning and plumbing</h4>
<p>Keep the bed <b>at least 8 ft from the stove</b>: quiet away from noisy. Keep the sink cabinet <b>within 10 ft of the bathroom pod</b>, so the plumbing can share pipes.</p>
<h4>7. Circulation</h4>
<p>You must be able to walk from the front door to every piece. Do not wall anything off.</p>`;

V.ruler=()=>{let o=`<svg class="vis" viewBox="0 0 440 130" role="img" aria-label="A ruler where every inch on paper stands for 4 real feet"><rect x="20" y="46" width="400" height="30" fill="#f2e6c8" stroke="#16202b" stroke-width="1.5"/>`;
  for(let i=0;i<=16;i++){const x=20+i*25,len=i%4===0?18:9;o+=`<line x1="${x}" y1="46" x2="${x}" y2="${46+len}" stroke="#16202b" stroke-width="1.2"/>`;}
  o+=`<g font-family="Josefin Sans,sans-serif" font-size="12" font-weight="700" fill="#16202b" text-anchor="middle">`;
  for(let i=0;i<=4;i++)o+=`<text x="${20+i*100}" y="94">${i} in</text><text x="${20+i*100}" y="36" fill="#b3701a">${i*4} ft</text>`;
  return o+`</g><text x="220" y="118" font-family="IBM Plex Sans,sans-serif" font-size="12" fill="#16202b" text-anchor="middle">Top: real feet. Bottom: inches on paper (1/4 inch scale).</text></svg>`;};

function caesarTable(){const A="ABCDEFGHIJKLMNOPQRSTUVWXYZ";return `<div class="tablewrap"><table class="cz"><tr><th>Coded</th>${[...A].map((c,i)=>`<td>${A[(i+3)%26]}</td>`).join("")}</tr><tr><th>Real</th>${[...A].map(c=>`<td>${c}</td>`).join("")}</tr></table></div>`;}
