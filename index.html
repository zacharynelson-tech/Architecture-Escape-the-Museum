const REFS={
"1a":L(`Before an architect draws a single line, they ask one question: <i>is this building any good?</i> A Roman writer named Vitruvius gave a three-part test more than 2,000 years ago, and architects still use it today.`,
`<h4>The three-part test</h4>${VIS(V.vit())}
<ul><li><b>Strength (Latin: Firmitas).</b> Strong means more than &ldquo;doesn&rsquo;t fall down today.&rdquo; A building must survive wind, snow, earthquakes, fire, and decades of use. The Pantheon in Rome is almost 1,900 years old and still stands. In 1940, the Tacoma Narrows Bridge in Washington State twisted in a steady wind and collapsed: that is what failing the strength test looks like.</li>
<li><b>Usefulness (Utilitas).</b> The building has to work for real people. Doorways are about 3 ft wide so wheelchairs fit. Stairs can&rsquo;t be too steep. There must be light to read by and exits you can find quickly. A gorgeous library with no way to reach the second floor fails the usefulness test.</li>
<li><b>Beauty (Venustas).</b> Beauty is not just decoration. It means good proportions, natural light, pleasant materials, and spaces that make people feel calm, curious, or inspired.</li></ul>
<h4>Why it&rsquo;s hard</h4><p>The three pull against each other. Strong materials cost more money. Useful layouts need space. Beautiful details need time. Architects make smart trade-offs so that none of the three is missing.</p>
<h4>How to use the test</h4><p>For any building, ask three questions: <b>Will it stand up? Can people use it easily? Does it feel good to be in?</b> If one answer is &ldquo;no,&rdquo; you have found the missing quality.</p>`,
`Strength means keeping your wood stove far from furniture. Usefulness means leaving clear floor space around every piece. Beauty means putting windows where the light and views are.`,
`Vitruvius wrote a ten-book guide called <i>De architectura</i>. It is the oldest surviving book on architecture.`),

"1b":L(`Architects work like a map app: they zoom in and out all day. A choice at one scale changes everything at the others, so you need to know all five.`,
`<h4>Five scales (shuffled, so you can sort them)</h4>
<div class="tablewrap"><table class="info"><tr><th>Scale</th><th>Typical size</th><th>What gets decided here</th></tr>
<tr><td><b>Building</b></td><td>a small house is about 30 to 50 ft across</td><td>shape, number of floors, structure, entrances, how rooms connect</td></tr>
<tr><td><b>City plan</b></td><td>measured in miles</td><td>where streets, parks, bus lines, homes, and shops go</td></tr>
<tr><td><b>Door handle (a detail)</b></td><td>about 5 inches long</td><td>how it feels in your hand, what it is made of, how high it is</td></tr>
<tr><td><b>Room</b></td><td>roughly 10 to 20 ft across</td><td>size, light, where furniture, doors, and windows go</td></tr>
<tr><td><b>Site</b></td><td>a typical house lot is about 50 ft by 100 ft</td><td>where the building sits, the driveway, plants, drainage, sun, and views</td></tr></table></div>
<h4>Human scale</h4><p>Everything starts with the human body. A standard door is about <b>6 ft 8 in tall and 3 ft wide</b>. Ceilings are about <b>8 ft</b> high. A kitchen counter is about <b>3 ft</b> high, a dining table about <b>2.5 ft</b>, and a stair step about <b>7 in</b>. When a building feels &ldquo;comfortable,&rdquo; it is usually because it follows human scale.</p>
<h4>How to solve</h4><p>Order the five by how much ground each one covers, from the smallest to the largest.</p>`,
`In the studio, every grid square is 1 foot. A bed is 5 ft wide and a door is 3 ft wide. You will work at room scale while thinking about the site (where the sun is) and details (how a door swings).`,
`Many architects begin by pacing off an empty room or site. An adult&rsquo;s walking step is about 2.5 ft, so your feet are a measuring tape you always carry.`),

"1c":L(`People have hidden messages for thousands of years. Julius Caesar is said to have used this shift code for military orders about 2,000 years ago. Architects have their own rule books too: <b>building codes</b>, which are laws that set safety rules for things like stairs, exits, and wiring.`,
`<h4>How the code works</h4><p>Every letter of the real message was replaced by the letter <b>3 places later</b> in the alphabet. The brass disk is set to 3. So real A became D, B became E, and so on. After Z the alphabet starts again at A.</p>
<h4>How to decode it</h4><ol><li>Find a coded letter in the top row of the table.</li><li>Read the real letter underneath it.</li><li>Do the whole word, then check that it spells a real word.</li></ol>${caesarTable()}
<p><b>Practice:</b> the coded word KHOOR decodes to HELLO (K&rarr;H, H&rarr;E, O&rarr;L, O&rarr;L, R&rarr;O). Now decode each word on the wall, one at a time.</p>
<h4>The idea behind the slogan</h4><p>The wall message is a famous design rule from an American architect named Louis Sullivan, who helped invent the skyscraper in Chicago in the 1890s. His idea: a building&rsquo;s <b>shape</b> should come from its <b>purpose</b>, what it is for. A lighthouse is tall because its light must be seen from far away. A fire station has huge doors because fire trucks have to roll through them. A barn has enormous doors because hay wagons have to fit.</p>`,
`Your cabin&rsquo;s shape comes from what Sam needs to do inside it: sleep, cook, eat, work, relax, and stay safe.`,
`Real cities have building codes too. Codes say how wide an exit must be, how far apart stair railings can be, and where smoke alarms go.`),

"1d":L(`A building is never designed by one person. Meet the people who shape the places we live in, using Sam&rsquo;s cabin as the example.`,
`<h4>Who does what on Sam&rsquo;s cabin?</h4><ul>
<li><b>Building architect:</b> meets Sam, writes down the needs (the program), sketches ideas, draws the plans, chooses materials, checks the safety rules, and leads the team of specialists. The architect is the one who sees the <i>whole</i> building.</li>
<li><b>Interior designer:</b> plans the inside: the furniture layout, kitchen cabinets, finishes (floor, wall, and counter materials), colors, and lighting.</li>
<li><b>Landscape architect:</b> designs the outdoors: the path to the door, where plants go, a patio or fire pit, and how rainwater drains away.</li>
<li><b>Structural engineer:</b> uses math and physics to decide if the cabin will stay up. A <b>load</b> is any weight the building must carry: people, furniture, snow on the roof. A <b>beam</b> is a horizontal piece that holds up a floor or roof. A <b>column</b> is a vertical post. The engineer calculates how big the beams and columns must be.</li>
<li><b>Urban planner:</b> usually works for a city or town. They decide where roads, parks, homes, and shops go across many blocks, and they may never design a single building.</li></ul>
<h4>A quick trick</h4><p>Ask: <i>how big is the thing, and what is the job?</i> One building: architect. Inside spaces: interior designer. Outdoor spaces: landscape architect. Whether it will hold up: structural engineer. A whole neighborhood or city: urban planner.</p>`,
`You will play architect and interior designer at the same time, choosing the layout and placing furniture, all while thinking about structure and safety.`,
`Architecture teams are often 5 to 20 people, even for a house. Skyscraper teams can include hundreds.`),

"2a":L(`Every architect learns by studying the masters. Here are six famous buildings and the big idea behind each one. Pay attention to the idea, because you can borrow it for your cabin.`,
`<h4>Six masterpieces</h4><div class="bcards">
<div class="bc">${V.bldg("fall")}<h5>Fallingwater</h5><p><b>Architect:</b> Frank Lloyd Wright (USA). Pennsylvania, finished in the late 1930s.</p><p><b>Big idea:</b> do not build next to the waterfall; build the house <i>over</i> it. Stone ledges and concrete terraces stick out like the rocks around it. Wright called this &ldquo;organic architecture&rdquo;: a building that belongs to its landscape.</p></div>
<div class="bc">${V.bldg("sagrada")}<h5>Sagrada Fam&iacute;lia</h5><p><b>Architect:</b> Antoni Gaud&iacute; (Spain). Barcelona, begun in 1882 and still being finished.</p><p><b>Big idea:</b> learn from nature. The columns branch like trees. Gaud&iacute; tested strong arch shapes by hanging weighted chains upside down.</p></div>
<div class="bc">${V.bldg("opera")}<h5>Sydney Opera House</h5><p><b>Architect:</b> J&oslash;rn Utzon (Denmark). Sydney, Australia, opened in 1973.</p><p><b>Big idea:</b> a roof made of sail-like shells beside the harbor. Utzon won an international design competition, and the building took about 14 years to build.</p></div>
<div class="bc">${V.bldg("louvre")}<h5>Louvre Pyramid</h5><p><b>Architect:</b> I. M. Pei (China/USA). Paris, France, opened in 1989.</p><p><b>Big idea:</b> a glass pyramid that is the entrance to the huge old museum. The glass lets daylight pour into the lobby underground and does not hide the old palace behind it.</p></div>
<div class="bc">${V.bldg("bilbao")}<h5>Guggenheim Museum Bilbao</h5><p><b>Architect:</b> Frank Gehry (Canada/USA). Bilbao, Spain, opened in 1997.</p><p><b>Big idea:</b> a building that looks like a sculpture, with curving walls covered in thin sheets of titanium metal. It drew so many visitors that cities now talk about the &ldquo;Bilbao effect.&rdquo;</p></div>
<div class="bc">${V.bldg("mies")}<h5>Seagram Building</h5><p><b>Architect:</b> Ludwig Mies van der Rohe (Germany/USA). New York City, finished in 1958.</p><p><b>Big idea:</b> &ldquo;Less is more.&rdquo; A calm tower of bronze-tinted glass and steel, set back from the street to make a public plaza.</p></div></div>
<h4>How to solve</h4><p>Match each architect on the list to the building they designed. One building on the list belongs to an architect who is not on the left: the decoy.</p>`,
`Borrow a big idea. Wright: connect your cabin to its surroundings. Pei: use glass to bring in light. Mies: keep the plan simple and clear.`),

"2b":L(`Time for detective work. Each portrait below has a story that makes it easy to recognize. Read these like clues in a case file.`,
`<h4>Case files</h4><ul>
<li><b>Zaha Hadid</b> (born in Baghdad, Iraq, 1950; died 2016). She first studied <b>mathematics</b> and then architecture in London. Her early designs were so bold that many were not built for years. She became known for flowing, curving, futuristic buildings, such as the Heydar Aliyev Center in Baku, Azerbaijan. In 2004 she became the <b>first woman to win the Pritzker Prize</b>.</li>
<li><b>Maya Lin</b> (born in the USA, 1959). While still a <b>college undergraduate</b>, she entered a national contest to design the Vietnam Veterans Memorial in Washington, D.C. Her entry was picked from more than 1,400 anonymous submissions. It is two polished black granite walls that slope into the ground, with the names of those who died carved into them. Some people disliked it at first, and now it is one of the most visited memorials in the country.</li>
<li><b>Ludwig Mies van der Rohe</b> (born in Germany, 1886; died 1969). He led a famous design school called the Bauhaus, then moved to the United States. He designed sleek skyscrapers of steel and glass, such as the Seagram Building in New York. His three-word motto was <b>&ldquo;Less is more.&rdquo;</b></li></ul>
<h4>The Pritzker Prize</h4><p>Often called architecture&rsquo;s Nobel Prize, it has been awarded every year since 1979 and comes with a $100,000 grant and a bronze medal.</p>
<h4>How to solve</h4><p>Underline the clue words in each riddle: a place, an award, an age or job, a motto, a material. Match them to the case files. Last names are enough.</p>`,
`Hadid, Lin, and Mies all used one clear, strong idea. For Sam&rsquo;s cabin the idea could be &ldquo;the cabin opens to the sun&rdquo; or &ldquo;everything has a place.&rdquo;`),

"2c":L(`Two of the six people on this wall are impostors: great <i>engineers</i>, not architects. To spot them you need to know how the two jobs are different.`,
`<h4>Architect or engineer?</h4><ul><li><b>Architects</b> design how a whole building looks, works, and feels for the people who use it: the layout, the light, the materials, and the experience.</li>
<li><b>Engineers</b> use advanced math and physics to make sure structures and systems work and are safe: that a bridge will carry traffic, that a beam will carry a roof.</li></ul>
<p>They work as a team, and their work overlaps, so famous structures are often credited to both.</p>
<h4>Two true stories</h4><ul>
<li><b>The Eiffel Tower:</b> built for the 1889 World&rsquo;s Fair in Paris by the company of <b>Gustave Eiffel</b>, a French engineer. Eiffel&rsquo;s name is on it, but he was an engineer who ran an engineering and construction company.</li>
<li><b>The Brooklyn Bridge:</b> designed by German-American engineer <b>John A. Roebling</b>, who died before building started. His son Washington and daughter-in-law Emily Roebling finished the job.</li></ul>
<h4>Someone who really was an architect</h4><p><b>Julia Morgan</b> (1872&ndash;1957) was the first woman licensed as an architect in California and the first woman admitted to the architecture program at the famous &Eacute;cole des Beaux-Arts in Paris. She designed Hearst Castle.</p>
<h4>How to solve</h4><p>Read each description and find the person&rsquo;s job. Select the two described as engineers.</p>`,
`When you place a wood stove or pick a loveseat, you are the architect. A structural engineer would work out the roof beams.`),

"2d":L(`This one is a logic puzzle. Logic puzzles are like building blueprints: you place a piece only when the clues prove it belongs there. Here is how to do it.`,
`<h4>The method: clues to order</h4><ol><li>Start with clues that give a sure spot: &ldquo;first,&rdquo; &ldquo;last,&rdquo; &ldquo;in the middle.&rdquo;</li>
<li>Treat &ldquo;<b>right before</b> X&rdquo; as a glued pair: it means the very next place, with nobody in between.</li>
<li>For &ldquo;A before B,&rdquo; A is somewhere to the left of B, not necessarily next to it.</li>
<li>Fill what is left and re-check every clue at the end.</li></ol>
<h4>Practice (with fruit, not architects)</h4><p>Put Apple, Banana, Cherry, and Date in a row. Clues: Cherry is last. Banana is right before Cherry. Apple is before Date. <br><b>Solution path:</b> Cherry is 4th. Banana is 3rd. That leaves places 1 and 2 for Apple and Date, and Apple is before Date, so Apple 1st and Date 2nd: <b>Apple, Date, Banana, Cherry</b>.</p>
<h4>About the prize</h4><p>The Pritzker Prize is given to one living architect each year. The five names here are all winners. The years have been scratched off, so all you have is the logic.</p>`,
`Logic is what makes the cabin checks work: if clue A says the stove is here, clue B tells you where the bed can be.`),

"3a":L(`Great architects follow a process. It looks messy from the outside, but it has six steps, and you can use them on anything, from a cabin to a school project.`,
`<h4>The six steps (and a day on Sam&rsquo;s cabin)</h4><ol>
<li><b>Define the problem.</b> Meet the client and list what they need, the budget, and the rules. <i>Sam: &ldquo;Two people, a wood stove, a desk, under $90,000.&rdquo;</i></li>
<li><b>Research and site analysis.</b> Visit the land. Where does the sun rise? Which way does the wind blow? Where does water run? <i>Sam&rsquo;s land slopes toward a stream.</i></li>
<li><b>Brainstorm concepts.</b> Fill pages with fast, rough sketches. Quantity beats perfection at this stage. <i>20 sketches: tall, round, L-shaped...</i></li>
<li><b>Schematic design.</b> Choose the strongest idea and draw a rough plan showing the rooms and how they connect. <i>The kitchen goes next to the dining area.</i></li>
<li><b>Develop and refine.</b> Pick materials and structure, build a detailed model, and work with the engineers. <i>Cedar siding, steel roof, beam sizes.</i></li>
<li><b>Present and revise.</b> Show the design to the client, listen, and change it. <i>Sam: &ldquo;Can the desk face the window?&rdquo;</i></li></ol>
<h4>It&rsquo;s a loop</h4><p>Feedback in the last step often sends the team back to an earlier step. That is normal: a design is never finished on the first try.</p>
<h4>How to solve</h4><p>Match each event to one of the six steps, then put the events in the order of the steps.</p>`,
`In the studio you will cycle through the loop yourself: place a piece, check it, fix it, and check again.`,
`Many architecture schools hold a &ldquo;crit,&rdquo; short for critique, where classmates and teachers question a student&rsquo;s design. It is how designers get better.`),

"3b":L(`Before an architect draws anything, they go to the land and become a detective: where does the sun hit, what are the rules, and what does the client need? Three big clues will help you crack these questions.`,
`<h4>1. The sun</h4>${VIS(V.sun())}<p>In the Northern Hemisphere (which includes the whole United States), the sun stays in the <b>southern</b> half of the sky. At about 40&deg; north latitude (like New York or Chicago), the noon sun climbs only about 26&deg; above the horizon in December but about 73&deg; in June. Architects use this: <b>large south windows</b> let low winter sun in for free heat, and a <b>roof overhang</b> shades the high summer sun to keep the room cool.</p>
<h4>2. The rules</h4>${VIS(V.setback())}<p>Towns have <b>zoning rules</b> about how land can be used and how big buildings can be. A <b>setback</b> is the minimum distance a building must stay back from the property line (often 10 to 30 ft, depending on the town). The area inside the setbacks is called the buildable area.</p>
<h4>3. The client&rsquo;s list</h4><p>The <b>program</b> is the written list of rooms and spaces the client needs, with sizes and special requirements. For Sam&rsquo;s cabin: &ldquo;sleep 2, cook, eat, work at a desk, wood stove, bathroom.&rdquo; A program written first keeps the design honest.</p>
<h4>Other site clues</h4><p>Architects also record wind direction, slope and drainage, nice views, noise, trees, and where the driveway can go.</p>`,
`The studio shows the south wall at the bottom. Put windows there for the winter sun, as the Floor 3 rule says.`,
`Some of the oldest buildings in the world face south (in the north) on purpose, because the builders understood the sun long before computers.`),

"3c":L(`Architects are secretly doing math all day. The most important kind is <b>area</b>: how much floor space something needs. Area is how an architect knows if the client&rsquo;s wish list will fit on the land and in the budget.`,
`<h4>Area for a rectangle</h4>${VIS(V.grid(5,3))}<p><b>Area = width &times; length.</b> A 5 ft by 3 ft rectangle has 5 &times; 3 = 15 square feet (sq ft). You can see it: 15 grid squares, each 1 ft by 1 ft.</p>
<h4>How big is that, really?</h4><p>A parking space is about 9 ft &times; 18 ft = 162 sq ft. A tiny cabin is 200 to 400 sq ft. A typical classroom is 750 to 900 sq ft. A typical new US house is about 2,400 sq ft.</p>
<h4>Circulation: the hidden area</h4><p>Hallways, entries, and wall thickness are space no one &ldquo;owns,&rdquo; but you need them to move around. Architects add a percentage called <b>circulation</b>, often 15% to 25%. In this puzzle use <b>20%</b>. To find 20% of a number, multiply by 0.20.</p>
<h4>Practice: a small cafe</h4><p>Seating room 20 ft &times; 20 ft = 400. Kitchen 10 ft &times; 15 ft = 150. Net area = 400 + 150 = 550 sq ft. Circulation = 550 &times; 0.20 = 110. <b>Total = 550 + 110 = 660 sq ft.</b></p>
<h4>How to solve</h4><ol><li>Find each room&rsquo;s area (width &times; length). There are two restrooms.</li><li>Add them to get the net area.</li><li>Find 20% of that.</li><li>Add it to the net area.</li></ol>`,
`Sam&rsquo;s cabin is 24 ft &times; 16 ft = 384 sq ft. Add up the furniture areas in the studio and you will see how much space is left for walking.`),

"3d":L(`Here is a trick every architect uses: before drawing walls, they draw <b>bubbles</b>. A bubble diagram is a quick map of which spaces want to be near each other, and which want to be far apart.`,
`<h4>Example: a small bakery</h4>${VIS(V.bubbles())}
<p>Customers come in the <b>entrance</b> and go straight to the <b>counter</b>. The counter must be right next to the <b>oven kitchen</b> so bread goes from oven to customer. The <b>storage</b> sits beside the kitchen. The <b>seating</b> is near the counter, but away from the kitchen heat and noise. The entrance and the kitchen are kept apart, so you never walk through the kitchen to get in.</p>
<h4>Questions to ask about any two rooms</h4><ul><li><b>Convenience:</b> do people go back and forth? Put them next to each other (kitchen and garage, for groceries).</li><li><b>Comfort:</b> is one noisy or smelly? Put the quiet room far away (bedroom and garage).</li><li><b>Privacy:</b> keep private rooms away from the front door.</li><li><b>Plumbing:</b> put &ldquo;wet&rdquo; rooms (kitchen, bath) near each other to save pipes.</li></ul>
<h4>How to solve</h4><p>The four spaces sit in a row, left to right. Start with the clue that fixes one room&rsquo;s spot (the garage is at the far left). Then add each room using the other clues.</p>`,
`In the studio, the same ideas appear as rules: bed far from the stove (comfort) and sink close to the bathroom (plumbing).`),

"4a":L(`A building cannot be explained with one picture. Architects make a <b>set of drawings</b>, and each drawing answers a different question. Here is the same little cabin shown six ways.`,
`${VIS(V.five())}
<h4>What each drawing is for</h4><ul>
<li><b>Site plan</b> (from above, showing the land): <i>Where on the lot does the building go? Where are the driveway and trees?</i></li>
<li><b>Floor plan</b> (from above, building sliced about 4 ft off the floor): <i>Where are the walls, doors, windows, and rooms?</i> It is the most important drawing for a cabin layout.</li>
<li><b>Elevation</b> (straight-on, side view of one outside wall, no perspective): <i>What does this wall look like, how tall is it, and where are the windows?</i></li>
<li><b>Section</b> (a vertical slice like cutting a cake): <i>How tall are the ceilings? How do the floors and stairs connect? How is the roof built?</i></li>
<li><b>Perspective</b> (a realistic 3D-style view with lines that meet far away at vanishing points): <i>What will it feel like to stand there?</i> Used to show clients.</li>
<li><b>Detail</b> (a big close-up): <i>How exactly does the roof meet the wall so rain can&rsquo;t get in?</i></li></ul>
<h4>How to solve</h4><p>Read each description and ask which of those six questions it answers.</p>`,
`The studio is a floor plan. When you place furniture on it, you are drawing exactly what real architects draw.`),

"4b":L(`A real building cannot fit on a sheet of paper, so architects draw it smaller by the same amount everywhere. That ratio is the <b>scale</b>. If you know the scale, you can measure anything in the drawing and know how big it is in real life.`,
`<h4>The most common scale</h4>${VIS(V.ruler())}
<p>At <b>1/4&Prime; = 1&prime;-0&Prime;</b> (say &ldquo;quarter-inch scale&rdquo;), every <b>1/4 inch on paper is 1 real foot</b>. That means <b>1 inch on paper = 4 feet</b>. At <b>1/8&Prime; = 1&prime;-0&Prime;</b>, every 1/8 inch is 1 foot, so <b>1 inch = 8 feet</b>.</p>
<h4>Two directions</h4><ul><li><b>Paper to real: multiply.</b> At 1/4&Prime; scale, 3 inches on paper &times; 4 = <b>12 ft</b>.</li><li><b>Real to paper: divide.</b> At 1/4&Prime; scale, 10 ft &divide; 4 = <b>2.5 inches</b>.</li><li>At 1/8&Prime; scale, 3 inches &times; 8 = <b>24 ft</b>.</li></ul>
<h4>What does a smaller scale mean?</h4><p>A <b>bigger</b> scale (1/4&Prime;) shows more detail but needs more paper. A <b>smaller</b> scale (1/8&Prime;) fits a larger building on one sheet.</p>
<h4>Tools</h4><p>Architects use a triangular <b>architect&rsquo;s scale ruler</b> that has many scales printed on its edges, so they can read feet directly.</p>
<p><b>Decimals are fine</b> in your answers (for example, 2.5).</p>`,
`At quarter-inch scale, Sam&rsquo;s 24 ft &times; 16 ft cabin would be only 6 inches &times; 4 inches on paper.`),

"4c":L(`A floor plan looks like a secret language, but it only has a handful of symbols. Learn them and you can &ldquo;walk through&rdquo; any building without leaving your chair.`,
`<h4>The symbol library</h4>${V.symbols()}
<p>The studio uses these same symbols. Compare them to the floor plan you will see on the board.</p>
<h4>How to read a plan, step by step</h4><ol>
<li><b>Find the walls.</b> The thick dark lines are walls. Outside walls are the thickest: about 6 inches in a real house.</li>
<li><b>Find the doors.</b> A door is a gap in the wall with a straight line (the door itself) and a curved arc that shows how far it swings open. The arc is clear floor space you must keep empty.</li>
<li><b>Find the windows.</b> A window is a thin line set inside a gap in an outside wall. Windows are never in the middle of the floor.</li>
<li><b>Read the labels.</b> Rooms are named inside them. Dimensions show lengths.</li>
<li><b>Look for the north arrow.</b> It tells you which way is north, so you know where the sun is.</li></ol>
<h4>Sizes to remember</h4><p>A front door is about 3 ft wide. A bedroom door is 2.5 to 3 ft. A typical window is 3 to 4 ft wide.</p>
<h4>How to solve</h4><p>Count every door swing (the entrance counts) and every thin window line in the outside walls. Then decide which room has the most windows.</p>`,
`In the studio, you will place a front door and windows exactly like this, and the swing arc will show the clearance you need.`),

"4d":L(`Lines on a drawing are not just lines. Different line styles mean different things. This is called the <b>language of lines</b>, and it is the same all over the world.`,
`<h4>The four lines you need</h4>${VIS(V.lines())}
<ul><li><b>Heavy (thick) solid line:</b> things that are <i>cut</i> by the drawing, such as the walls in a floor plan. Heavy means &ldquo;this is important and solid.&rdquo;</li>
<li><b>Dashed line:</b> something that is there, but you can&rsquo;t see it from this view: it is <b>hidden</b> behind something or <b>overhead</b> above the cut (like a beam above a window).</li>
<li><b>Dash-dot (chain) line:</b> a <b>centerline</b>, an imaginary line through the middle of something, such as a column. It tells builders where to measure from.</li>
<li><b>Thin solid line with arrows and a number:</b> a <b>dimension</b>. It tells you a length, such as 12&prime;-0&Prime; (12 feet, 0 inches).</li></ul>
<h4>Line weights</h4><p>Heavy, medium, and thin lines give a drawing depth, like a volume knob for importance. Walls are heavy, furniture is thin, and dimensions are the thinnest.</p>
<h4>How to solve</h4><p>Match each line style to what it means, using the list above.</p>`,
`The dashed orange zones in the studio are a version of this idea: they show things that are not walls but still matter (clear space).`),

"5a":L(`How does an idea become a real building? In six <b>phases</b>. Each phase takes what the last one produced and makes the next thing. Think of it as a relay race.`,
`<h4>The six phases (alphabetical, not in order)</h4><div class="phases">
<div class="phc"><h5>Bidding and negotiation</h5><p><b>Needs:</b> a full set of drawings and written instructions. <b>Produces:</b> prices from contractors and a chosen builder. A <b>bid</b> is a contractor&rsquo;s price offer.</p></div>
<div class="phc"><h5>Construction administration</h5><p><b>Needs:</b> a chosen builder and a permit. <b>Produces:</b> the finished building. The architect visits the site, answers questions, and checks the work.</p></div>
<div class="phc"><h5>Construction documents</h5><p><b>Needs:</b> a detailed design. <b>Produces:</b> complete drawings plus <b>specifications</b> (written instructions on materials and quality), used to get a <b>permit</b> (official permission from the town) and for pricing.</p></div>
<div class="phc"><h5>Design development</h5><p><b>Needs:</b> a chosen rough plan. <b>Produces:</b> a detailed design with materials, structure, and systems selected.</p></div>
<div class="phc"><h5>Programming (pre-design)</h5><p><b>Needs:</b> a client with an idea. <b>Produces:</b> a written list of needs, the budget, and the schedule.</p></div>
<div class="phc"><h5>Schematic design</h5><p><b>Needs:</b> the client&rsquo;s written needs. <b>Produces:</b> rough layouts and the big idea.</p></div></div>
<h4>How to solve</h4><p>Use the <b>Needs</b> and <b>Produces</b> lines. Whatever one phase produces is what the next one needs. Line them up like dominoes.</p>
<p>A small cabin might take a few months to design and several months to build. A skyscraper takes years.</p>`,
`Sam&rsquo;s cabin will go through all six. The studio is your schematic-design work.`),

"5b":L(`Picture a Tuesday on a job site. The architect isn&rsquo;t holding a hammer: they&rsquo;re answering questions and making sure that what gets built matches the plan. Four pieces of paper keep everyone on the same page.`,
`<h4>The paper trail</h4><ul>
<li><b>RFI (Request for Information).</b> The contractor writes: &ldquo;The drawing shows a door where the stairs are. Which is right?&rdquo; The architect must answer in writing. One answered RFI can save thousands of dollars and days of work.</li>
<li><b>Submittal.</b> Before the contractor orders or installs something, they send the architect a sample or product sheet to approve. Example: a piece of the floor tile, before 5,000 are ordered.</li>
<li><b>Change order.</b> If the client wants something new (a skylight) or a surprise happens, they write the change down. A <b>change order</b> officially adjusts the contract&rsquo;s work, price, and schedule.</li>
<li><b>Punch list.</b> At the very end, the architect walks through with a list of small unfinished or damaged items, such as a scratched door or a missing outlet cover. The contractor fixes the list before the project is complete.</li></ul>
<h4>A word that doesn&rsquo;t belong</h4><p>A <b>bid</b> is a contractor&rsquo;s price offer to do the job. It happens <i>before</i> construction starts.</p>
<h4>How to solve</h4><p>Ask yourself: is this moment a question, a sample, a change to the contract, or an end-of-job list?</p>`,
`Every piece of furniture in the studio has a specification of its own: its size and its clearance.`),

"5c":L(`The architect leads, but the architect does not do everything. Here is the expert team, so you know who to call.`,
`<h4>The consultants</h4><ul>
<li><b>Structural engineer:</b> decides how thick and strong the beams, columns, and foundations must be. They study the loads: the weight of the building, the people and furniture inside, and the snow and wind outside. In snowy areas a roof must carry thousands of pounds of snow.</li>
<li><b>MEP engineers:</b> the letters stand for <b>M</b>echanical (heating, cooling, ducts), <b>E</b>lectrical (wires, lights, outlets), and <b>P</b>lumbing (water and drain pipes). They fit all of these inside the walls and ceilings.</li>
<li><b>Civil engineer:</b> works on the land outside: <b>grading</b> (shaping the ground so water flows away from the building, usually dropping at least 6 inches over the first 10 ft), drainage, roads, and <b>utilities</b> (the water, sewer, and power lines that connect to the street).</li></ul>
<h4>Decide fast: where is the problem?</h4><p>If the building might not hold up: structural. If a system inside the walls needs room: MEP. If the problem is the land, water, or connections outside: civil.</p>
<h4>The wet wall trick</h4><p>MEP engineers love when kitchens and bathrooms share a wall, called a <b>wet wall</b>, because the pipes can be packed together. Fewer pipes means lower cost and fewer leaks.</p>`,
`In the studio, one rule is exactly this: the kitchen sink must be near the bathroom pod.`),

"5d":L(`This is the road you could take. It is a long one, but every step is something you can start getting ready for in 9th grade.`,
`<h4>The four steps to becoming an architect</h4><ol>
<li><b>Education.</b> Earn a degree from a school whose program is <b>accredited</b> (officially approved as meeting high standards) by the <b>NAAB</b>, the National Architectural Accrediting Board. That is a 5-year Bachelor of Architecture, or a 4-year bachelor&rsquo;s degree plus a 2 to 3 year Master of Architecture. You study design studios, drawing, history, math, structures, and more.</li>
<li><b>Experience.</b> Log supervised work hours in an architecture office through the <b>AXP</b>, the Architectural Experience Program.</li>
<li><b>Exam.</b> Pass the <b>ARE</b>, the Architect Registration Examination. It has several parts about design, construction, and practice.</li>
<li><b>License.</b> Your state gives you a <b>license</b>, the legal permission to call yourself an architect and sign building plans.</li></ol>
<p>The <b>AIA</b> (American Institute of Architects) is the professional membership organization for architects. <b>BIM</b> (Building Information Modeling) is a kind of design software, not a step on the path.</p>
<h4>How to start now</h4><p>Take geometry, art, and physics. Sketch every day. Build models from cardboard. Join a design or robotics club. Visit a local architecture office.</p>
<h4>Related careers</h4><p>Landscape architect, interior designer, urban planner, structural engineer, drafter, 3D visualizer, historic preservationist.</p>`,
`You are about to do the first real step: design a floor plan and have it checked against rules, just like the early studios in architecture school.`)
};

/* ============================================================
   QUICK FACTS: the short definitions-and-method box shown on Medium.
   ============================================================ */
function caesarRef(){
  const A="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const coded=[...A].map((c,i)=>A[(i+3)%26]);
  const row=(arr,cls)=>`<tr class="${cls}">`+arr.map(c=>`<td>${c}</td>`).join("")+`</tr>`;
  return `<p>A <b>Caesar cipher</b> is a secret code that moves every letter a fixed number of places along the alphabet. The brass disk is set to <b>3</b>, so when the message was written each real letter was replaced by the letter <b>3 places later</b> (A became D, B became E, and so on, wrapping around from Z to A).</p>
  <p><b>To decode</b>, go the other way: find each coded letter in the top row of the table and read the real letter underneath it.</p>
  <div class="tablewrap"><table class="cz"><tr><th>Coded</th>${coded.map(c=>`<td>${c}</td>`).join("")}</tr><tr><th>Real</th>${[...A].map(c=>`<td>${c}</td>`).join("")}</tr></table></div>
  <p><b>Practice example:</b> the coded word KHOOR decodes to HELLO (K&rarr;H, H&rarr;E, O&rarr;L, O&rarr;L, R&rarr;O). Decode the whole slogan one word at a time. The famous slogan was written by an American architect more than a century ago.</p>`;
}
const QUICK = {
"1a":`<p><b>Vitruvius</b> was a Roman writer on architecture who lived more than 2,000 years ago. He said every good building needs three qualities, each with a Latin name:</p>
<ul><li><b>Firmitas</b> means <b>strength</b>: the building stands up, survives storms, and lasts.</li>
<li><b>Utilitas</b> means <b>usefulness</b>: it works well for the people who use it (easy to enter, move around in, and use safely).</li>
<li><b>Venustas</b> means <b>beauty</b>: it looks good and feels good to be in.</li></ul>
<p><b>How to solve:</b> for each building below, ask which of the three qualities it clearly does <i>not</i> have.</p>`,
"1b":`<p>Architects think at different <b>scales</b>, from tiny details to whole cities. Here are the five scales (in no particular order):</p>
<ul><li><b>A building:</b> many rooms joined together under one roof.</li>
<li><b>A city plan:</b> many buildings, streets, parks, and neighborhoods.</li>
<li><b>A door handle:</b> a small detail you could hold in your hand.</li>
<li><b>A room:</b> one space, a few steps wide.</li>
<li><b>The site:</b> the piece of land the building sits on, including its parking lot, paths, and plants.</li></ul>
<p><b>How to solve:</b> order them by how much space each one covers, smallest first.</p>`,
"1c":caesarRef(),
"1d":`<p>Many people help design the places we live in. Here is what each does:</p>
<ul><li><b>Building architect:</b> leads the design of a building such as a house or school and coordinates the whole team of specialists.</li>
<li><b>Interior designer:</b> plans the inside of a space: layout, finishes (floors, walls, colors), furniture, and lighting.</li>
<li><b>Landscape architect:</b> designs outdoor spaces such as parks, plazas, gardens, and paths.</li>
<li><b>Structural engineer:</b> uses math and physics to make sure a structure is safe. A <b>load</b> is the weight a structure must carry (people, furniture, snow). A <b>beam</b> is a horizontal piece that holds up a floor or roof, and a <b>column</b> is a vertical post.</li>
<li><b>Urban planner:</b> decides how whole neighborhoods and cities are laid out, including where streets, homes, and shops should go.</li></ul>
<p><b>How to solve:</b> match each description to the job it fits best. Each job is used once.</p>`,
"2a":`<p>Fact file on the architects in this hall (in alphabetical order):</p>
<ul><li><b>Antoni Gaud&iacute;</b> (Spain) designed the <b>Sagrada Fam&iacute;lia</b> church in Barcelona.</li>
<li><b>Frank Gehry</b> (Canada/USA) designed the <b>Guggenheim Museum Bilbao</b> in Spain, covered in curving sheets of titanium metal.</li>
<li><b>Frank Lloyd Wright</b> (USA) designed <b>Fallingwater</b>, a house built over a waterfall in Pennsylvania.</li>
<li><b>I. M. Pei</b> (China/USA) designed the glass <b>Louvre Pyramid</b> in Paris.</li>
<li><b>J&oslash;rn Utzon</b> (Denmark) designed the <b>Sydney Opera House</b> in Australia, with its sail-like roof shells.</li>
<li><b>Ludwig Mies van der Rohe</b> (Germany/USA) designed the steel-and-glass <b>Seagram Building</b> in New York.</li></ul>
<p><b>How to solve:</b> match each architect on the left to the building they designed. One building on the list belongs to an architect who is not on the left.</p>`,
"2b":`<p>Facts for the three mystery portraits:</p>
<ul><li><b>Zaha Hadid</b> (Iraq/UK, 1950&ndash;2016) designed buildings with flowing, curving, futuristic shapes. She was the <b>first woman to win the Pritzker Prize</b>, in 2004.</li>
<li><b>Maya Lin</b> (USA, born 1959) designed the <b>Vietnam Veterans Memorial</b> in Washington, D.C. while she was a college student. It is two long polished black granite walls.</li>
<li><b>Ludwig Mies van der Rohe</b> (Germany/USA, 1886&ndash;1969) designed sleek steel-and-glass skyscrapers and is famous for the three-word motto &ldquo;<b>Less is more</b>.&rdquo;</li></ul>
<p>The <b>Pritzker Prize</b> is architecture&rsquo;s highest honor, often compared to the Nobel Prize.</p>
<p><b>How to solve:</b> match each riddle to one of the three people. Writing just the last name is fine.</p>`,
"2c":`<p><b>Architects</b> design how a building looks, works, and feels for the people who use it. <b>Engineers</b> use math and physics to calculate how structures stand up and carry loads. The jobs overlap and the two professions often work together, but they are not the same job.</p>
<p><b>How to solve:</b> read the job title in each description. Two of the six people are described as <b>engineers</b>, not architects. Select those two.</p>`,
"2d":`<p>The Pritzker Prize is given to one architect each year. The years on the wall have been scratched off, so you must use the four clues to rebuild the order.</p>
<p><b>How to solve a clue puzzle:</b> start with the clues that put someone in a definite spot (first or last). &ldquo;Right before&rdquo; means the very next place in the line, with nobody in between. Then place the others one at a time, checking that every clue is still true. Use the &#9650; and &#9660; buttons to move names.</p>`,
"3a":`<p>Architects follow six steps, often looping back as they learn more:</p>
<ol><li><b>Define the problem:</b> meet the client and list what they need, plus the budget and rules.</li>
<li><b>Research and site analysis:</b> study the land: sun, wind, views, slope, neighbors, and zoning rules.</li>
<li><b>Brainstorm concepts:</b> make many quick sketches of different big ideas.</li>
<li><b>Schematic design:</b> pick the strongest idea and draw rough room layouts.</li>
<li><b>Develop and refine:</b> choose materials and structure, build detailed models, and work with engineers.</li>
<li><b>Present and revise:</b> show the plan to the client, listen to feedback, and change it.</li></ol>
<p><b>How to solve:</b> match each event to the step it shows, then put the events in step order.</p>`,
"3b":`<ul><li><b>Sun direction:</b> the Earth&rsquo;s Northern Hemisphere (which includes the whole United States) has the sun in the <b>southern</b> part of the sky. A south-facing window therefore catches the most sunlight, especially in winter when the sun is low.</li>
<li><b>Setback:</b> the minimum distance a building must stay back from the edge of its property (the property line). Towns require setbacks so buildings are not built right against the street or neighbors.</li>
<li><b>Program:</b> the client&rsquo;s list of the rooms and spaces they need, with sizes and requirements. Architects write the program in the first step of design.</li></ul>`,
"3c":`<p><b>Area</b> measures how much floor a space covers. For a rectangle, <b>area = width &times; length</b>, in <b>square feet</b> (sq ft). Example: a 10 ft by 15 ft room has an area of 10 &times; 15 = 150 sq ft.</p>
<p>Architects also add space for hallways and wall thickness, called circulation. A common rule of thumb is to add <b>20%</b> of the total room area. To find 20% of a number, multiply it by 0.20 (20% of 500 is 500 &times; 0.20 = 100).</p>
<p><b>How to solve:</b></p>
<ol><li>Find the area of each room (width &times; length). Remember the restrooms: there are two.</li>
<li>Add all the room areas together.</li>
<li>Find 20% of that total.</li>
<li>Add it to the total from step 2. That is the answer.</li></ol>`,
"3d":`<p>A <b>bubble diagram</b> is a quick sketch of circles showing which rooms should be next to each other and which should be far apart. Architects think about convenience (a kitchen near the garage for carrying groceries) and comfort (a bedroom away from noise).</p>
<p><b>How to solve:</b> the four rooms sit in a row, left to right. Put the garage at the far left, then add the rooms one by one so that every clue stays true.</p>`,
"4a":`<p>A full set of drawings shows a building in different ways:</p>
<ul><li><b>Detail drawing:</b> a large close-up that shows how pieces connect, such as where a roof meets a wall.</li>
<li><b>Elevation:</b> a straight-on view of one outside face of the building (front, back, or side). It has no perspective, so it looks flat.</li>
<li><b>Floor plan:</b> a view from directly above, as if the building were sliced about four feet above the floor and the top lifted off. It shows walls, doors, windows, and rooms.</li>
<li><b>Perspective:</b> a realistic 3D-style view where parallel lines seem to meet in the distance (vanishing points). It shows clients what the building will look like.</li>
<li><b>Section:</b> a vertical slice through the building, like cutting a cake, showing ceiling heights, floors, and stairs.</li>
<li><b>Site plan:</b> a top-down view of the whole property: the building outline, driveway, paths, and trees.</li></ul>`,
"4b":`<p>A drawing is much smaller than the real building, so it uses a <b>scale</b>. At <b>1/4&Prime; = 1&prime;-0&Prime;</b> every 1/4 inch on paper stands for 1 real foot. That means <b>1 inch on paper = 4 feet</b>. At <b>1/8&Prime; = 1&prime;-0&Prime;</b>, 1 inch on paper = 8 feet.</p>
<ul><li><b>Paper to real:</b> multiply the inches by the feet-per-inch. Example at 1/4&Prime; scale: 3 inches on paper &times; 4 = 12 feet in real life.</li>
<li><b>Real to paper:</b> divide the feet by the feet-per-inch. Example at 1/4&Prime; scale: 10 feet &divide; 4 = 2.5 inches on paper.</li>
<li>Example at 1/8&Prime; scale: 3 inches on paper &times; 8 = 24 feet.</li></ul>
<p>Decimals are fine in your answers (for example 2.5).</p>`,
"4c":`<p>A <b>floor plan</b> is a view from above. Symbols stand for building parts:</p>
<ul><li>The thick dark lines are the <b>walls</b>.</li>
<li>A <b>door</b> is a gap in a wall with a straight line (the door leaf) and a curved arc showing how far it swings open.</li>
<li>A <b>window</b> is a thin line set inside a gap in an outside wall.</li></ul>
<p><b>How to solve:</b> count the swing arcs for doors (the entrance counts) and the thin lines in the outside walls for windows. Then decide which room has the most windows.</p>`,
"4d":`<p>Architects use line styles like a language, so anyone trained can read any drawing:</p>
<ul><li><b>Heavy (thick) solid line:</b> an object that is cut by the drawing, such as walls in a floor plan.</li>
<li><b>Dashed line:</b> something that exists but is <b>hidden</b> from view or located <b>overhead</b> (above the cut), such as a beam above.</li>
<li><b>Dash-dot (chain) line:</b> a <b>centerline</b>, an imaginary line through the middle of something such as a column.</li>
<li><b>Thin solid line with arrows and a number:</b> a <b>dimension</b>, which tells you a measurement (length or width).</li></ul>`,
"5a":`<p>An architect&rsquo;s work happens in six phases, each one using the results of the one before. (A <b>permit</b> is official permission from the town to build. <b>Specifications</b> are written instructions that describe the materials and quality of work.)</p>
<ul><li><b>Bidding and negotiation:</b> contractors price the job, and the client picks a builder.</li>
<li><b>Construction administration:</b> the architect visits the site, answers questions, and reviews the work until the building is finished.</li>
<li><b>Construction documents:</b> complete drawings and specifications used to get permits, get prices, and build.</li>
<li><b>Design development:</b> materials, structure, and systems are chosen and detailed.</li>
<li><b>Programming (pre-design):</b> learn what the client needs, plus the budget and schedule.</li>
<li><b>Schematic design:</b> draw rough layouts and settle on the big idea.</li></ul>
<p><b>How to solve:</b> ask what has to exist before each phase can happen. For example, nobody can price a building that has not been drawn yet.</p>`,
"5b":`<p>On a construction job, the <b>contractor</b> builds and the <b>architect</b> answers questions and approves work. Four common paperwork moments:</p>
<ul><li><b>RFI (request for information):</b> a question from the contractor when something in the drawings is unclear or seems wrong.</li>
<li><b>Submittal:</b> a sample or product information the contractor sends the architect to approve <i>before</i> ordering or installing it.</li>
<li><b>Change order:</b> a written agreement that changes the contract&rsquo;s work, price, or schedule.</li>
<li><b>Punch list:</b> the list of small unfinished or damaged items to fix near the end of the project.</li></ul>
<p>A <b>bid</b> is a contractor&rsquo;s price offer to build a project. It happens before construction starts.</p>`,
"5c":`<p>An architect works with a team of specialists, called <b>consultants</b>:</p>
<ul><li><b>Structural engineer:</b> designs the beams, columns, and foundations that hold the building up.</li>
<li><b>MEP engineers:</b> design the <b>M</b>echanical systems (heating, cooling, and ductwork), <b>E</b>lectrical systems, and <b>P</b>lumbing. &ldquo;MEP&rdquo; is the short name.</li>
<li><b>Civil engineer:</b> designs the site: <b>grading</b> (shaping the ground so water drains away), drainage, roads, and <b>utilities</b> (water, sewer, and power connections to the street).</li></ul>
<p><b>How to solve:</b> decide whether each problem is about holding the building up, the building&rsquo;s systems inside, or the land and connections outside.</p>`,
"5d":`<p>The usual path to becoming a licensed architect in the United States:</p>
<ol><li>Earn a degree from a program that is <b>accredited</b> (officially approved as meeting standards) by the <b>NAAB</b>, the National Architectural Accrediting Board. This is a 5-year Bachelor of Architecture, or a bachelor&rsquo;s degree plus a 2&ndash;3 year Master of Architecture.</li>
<li>Log supervised work hours through the <b>AXP</b>, the Architectural Experience Program.</li>
<li>Pass the <b>ARE</b>, the Architect Registration Examination, which has several parts.</li>
<li>Get <b>licensed</b> (legal permission to practice) by your state.</li></ol>
<p>The <b>AIA</b>, the American Institute of Architects, is a professional membership organization for architects. <b>BIM</b> (Building Information Modeling) is a type of design software, not part of the licensing path.</p>`
};

  const txt=(x,y,s,size,fill,a)=>`<text x="${f(x)}" y="${f(y)}" text-anchor="middle" font-family="${HEAD}" font-weight="700" font-size="${size}" fill="${fill}" ${a||""}>${s}</text>`;
  const ell=(x,y,rx,ry,a)=>`<ellipse cx="${f(x)}" cy="${f(y)}" rx="${f(rx)}" ry="${f(ry)}" ${a||""}/>`;
  const shadow=(x,y,rx,ry,op)=>ell(x,y,rx,ry,`fill="#000" opacity="${op||.5}" filter="url(#b5)"`);

  const box=(s,t,w,h,side,top)=>{const [x,y]=fp(s,t),k=K(t),W=w*k,H=h*k;

    <linearGradient id="gC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c.ceilA}"/><stop offset="1" stop-color="${c.ceilB}"/></linearGradient>

function tick(){
  if(!S.start||S.end) return;
  const now=Date.now(); let dt=now-(S.last||now); if(dt<0) dt=0; if(dt>60000) dt=60000;
  S.last=now; S.clock=(S.clock||0)+dt*LEVELS[S.level].rate; S.spent[S.level]=(S.spent[S.level]||0)+dt;
}

function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k==="class") e.className = v;
    else if(k==="html") e.innerHTML = v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if(v!==false && v!==null && v!==undefined) e.setAttribute(k, v===true?"":v);
  }
  kids.flat().forEach(c=>{ if(c==null||c===false) return; e.append(c.nodeType ? c : document.createTextNode(/&#?\w+;/.test(c) ? decode(String(c)) : c)); });
  return e;
}
const decode = s => { const t=document.createElement("textarea"); t.innerHTML=s; return t.value; };
const norm = s => decode(String(s)).toLowerCase().replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim().replace(/^(the|a|an)\s+/,"");
function numval(s){
  s = String(s).toLowerCase().replace(/,/g,"").replace(/\b(feet|foot|ft|inches|inch|in|sq|square)\b/g," ").replace(/["'”’′″]/g," ").replace(/\s+/g," ").trim();
  let m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/); if(m) return +m[1] + (+m[2])/(+m[3]);
  m = s.match(/^(\d+)\/(\d+)$/); if(m) return (+m[1])/(+m[2]);
  return /^\d*\.?\d+$/.test(s) ? parseFloat(s) : NaN;
}

      h("span",{class:"obtns"},
        h("button",{class:"mini",type:"button","aria-label":"Move up",disabled:pos===0,onclick:()=>{[arr[pos-1],arr[pos]]=[arr[pos],arr[pos-1]];draw();}},"▲"),
        h("button",{class:"mini",type:"button","aria-label":"Move down",disabled:pos===arr.length-1,onclick:()=>{[arr[pos+1],arr[pos]]=[arr[pos],arr[pos+1]];draw();}},"▼")
      ))));
    draw();
    return {el:list, check(){
      const c = arr.filter((idx,pos)=>idx===pos).length;
      return c===arr.length ? {ok:true,msg:"Perfect order."} : {ok:false,msg:`${c} of ${arr.length} are in the right place.`};
    }};
  },
  match(p){
    const opts = [...p.options].sort((a,b)=>norm(a).localeCompare(norm(b)));
    const sels = p.pairs.map(()=>h("select",{},h("option",{value:""},"Choose…"),opts.map(o=>h("option",{value:decode(o),html:o}))));
    const rows = p.pairs.map((pr,k)=>h("label",{class:"mrow"},h("span",{html:pr[0]}),sels[k]));
    return {el:h("div",{},rows), check(){
      const c = p.pairs.filter((pr,k)=>sels[k].value===decode(pr[1])).length;
      return c===p.pairs.length ? {ok:true,msg:"All matches are correct."} : {ok:false,msg:`${c} of ${p.pairs.length} matches are correct.`};
    }};
  },
  pick(p){
    const boxes = p.options.map(()=>h("input",{type:"checkbox"}));
    const rows = p.options.map((o,k)=>h("label",{class:"pickrow"},boxes[k],h("span",{html:o})));
    return {el:h("div",{},rows), check(){
      const sel = boxes.map((b,k)=>b.checked?k:-1).filter(k=>k>=0);
      const ok = sel.length===p.correct.length && p.correct.every(k=>sel.includes(k));
      return ok ? {ok:true,msg:"Both impostors found."} : {ok:false,msg: sel.length!==p.correct.length ? `Select exactly ${p.correct.length} names.` : "Not quite. Check each person's job."};
    }};
  }
};

function solvedCard(p, num){
  return h("article",{class:"puzzle solved"},
    h("div",{class:"ph"}, h("h3",{},p.title), h("span",{class:"digit"},`Digit #${num}: ${p.digit}`)),
    h("div",{class:"reveal",html:p.reveal}));
}

function activeCard(p, num, total, onSolved){
  const card = h("article",{class:"puzzle"});
  const ui = TYPES[p.type](p);
  const status = h("div",{class:"msg",role:"status","aria-live":"polite"});
  const hintBox = h("div",{class:"hints"});
  const hintBtn = h("button",{class:"btn ghost",type:"button"});
  const cap = Math.min(p.hints.length, LEVELS[S.level].hints);
  const drawHints = () => {
    const n = S.hints[p.id]||0;
    hintBox.replaceChildren(...p.hints.slice(0,n).map((t,k)=>h("p",{class:"hint"},h("b",{},`Hint ${k+1}: `),h("span",{html:t}))));
    if(cap===0 && n===0){ hintBtn.hidden=true; hintBox.replaceChildren(h("p",{class:"muted"},"There are no hints on Hard. Stuck? Use the level button at the top to switch to an easier level (your clock will run faster).")); return; }
    hintBtn.hidden=false;
    hintBtn.textContent = n>=cap ? "No more hints on this level" : `Need a hint? (${n}/${cap} used)`;
    hintBtn.disabled = n>=cap;
  };
  hintBtn.addEventListener("click",()=>{
    const n = S.hints[p.id]||0;
    if(n<cap){ S.hints[p.id]=n+1; save(); drawHints(); const c=document.getElementById("hintcount"); if(c) c.textContent=hintTotal(); }
  });
  const checkBtn = h("button",{class:"btn",type:"button",onclick:()=>{
    const r = ui.check();
    status.className = "msg "+(r.ok?"good":"bad"); status.textContent = r.msg;
    if(r.ok){ S.solved[p.id]=true; save(); setTimeout(()=>onSolved(card),450); }
  }},"Check answer");
  card.append(
    h("div",{class:"ph"}, h("h3",{},p.title), total?h("span",{class:"pn"},`Puzzle ${num} of ${total}`):null),
    h("div",{class:"prompt",html:p.prompt}),
    ui.el,
    h("div",{class:"actions"},checkBtn,hintBtn),
    status, hintBox
  );
  drawHints();
  return card;
}

/* ---------- shared chrome ---------- */

    h("header",{class:"top"},h("div",{class:"wrap"},

        S.start?h("span",{id:"timer",class:late?"late":"","aria-label":"Team clock"},fmt(elapsed())):null,

      ))),

}
function keycards(){

}
function footer(){
  return h("footer",{class:"foot"},h("div",{class:"wrap"},h("span",{class:"lbl"},"Keycard fragments:"),...keycards()));
}
function floorNav(){

/* ---------- difficulty picker ---------- */
function levelCards(selected,onPick){
  return Object.keys(LEVELS).map(k=>{const L=LEVELS[k];
    return h("label",{class:"lvlcard"+(k===selected?" sel":"")},
      h("input",{type:"radio",name:"lvl",value:k,checked:k===selected,onchange:()=>onPick(k)}),
      h("span",{class:"lvlname"},L.label),
      h("span",{class:"lvlclock "+L.cls},`Clock ×${L.rate}`),
      h("span",{class:"lvltag"},L.clockText),
      h("ul",{},L.gives.map(t=>h("li",{html:t}))));});
}
function openLevelDialog(){
  if(document.getElementById("lvldlg")) return;
  let pick=S.level;
  const wrap=h("div",{id:"lvldlg",class:"modal",role:"dialog","aria-modal":"true","aria-label":"Change difficulty level"});
  const esc=e=>{ if(e.key==="Escape") close(); };
  const close=()=>{ wrap.remove(); document.removeEventListener("keydown",esc); };
  const grid=h("div",{class:"lvlgrid"}), note=h("p",{class:"msg"}), go=h("button",{class:"btn",type:"button"});
  const draw=()=>{
    grid.replaceChildren(...levelCards(pick,k=>{pick=k;draw();}));
    const cur=LEVELS[S.level],nw=LEVELS[pick];
    if(pick===S.level){ note.className="msg"; note.textContent="This is your current level."; }
    else if(nw.rate>cur.rate){ note.className="msg bad"; note.textContent=`Going easier: from now on your clock runs ${nw.rate/cur.rate===2?"twice":nw.rate/cur.rate+" times"} as fast as it does now. That is the price of extra help. Time already on the clock stays the same.`; }
    else { note.className="msg good"; note.textContent=`Going harder: from now on your clock runs ${cur.rate/nw.rate===2?"half":"slower"} as fast as it does now, and you get less help. Time already on the clock stays the same.`; }
    go.textContent=pick===S.level?"Keep this level":`Switch to ${nw.label}`; go.disabled=pick===S.level;
  };
  go.addEventListener("click",()=>{ setLevel(pick); close(); render(); });
  draw();
  wrap.append(h("div",{class:"box"},h("h2",{},"Change difficulty"),h("p",{},"You can change the level at any time. The team clock speed depends on the level you are on."),grid,note,
    h("p",{class:"muted"},"The page reloads when you switch, so finish typing your answer first."),
    h("div",{class:"actions"},go,h("button",{class:"btn ghost",type:"button",onclick:close},"Cancel"))));
  wrap.addEventListener("click",e=>{ if(e.target===wrap) close(); });
  document.addEventListener("keydown",esc); document.body.append(wrap);
  const first=wrap.querySelector("input:checked"); if(first) first.focus();
}

/* ---------- screens ---------- */
function startScreen(){
  const input = h("input",{type:"text",placeholder:"Team name",maxlength:"30","aria-label":"Team name",autocomplete:"off"});
  let pick="medium";
  const grid=h("div",{class:"lvlgrid"});
  const drawLv=()=>grid.replaceChildren(...levelCards(pick,k=>{pick=k;drawLv();}));
  drawLv();
  const go = () => {
    S = fresh(); S.team = input.value.trim() || "Unnamed team"; beginClock(pick); S.screen="room"; save(); render();
  };
  input.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
  const skyline = heroRender();
  return h("div",{},
    topbar(),
    h("div",{class:"wrap"},h("div",{class:"hero"},
      h("div",{},
        h("h1",{},"Escape the Skyline Museum of Architecture"),
        h("p",{class:"lead"},"Your class stayed late for the museum&rsquo;s night tour, and now the doors are sealed. The only way out is down five floors, and every floor is locked behind a keypad. Learn what architects really do from Juno&rsquo;s field notes, solve the puzzles, and then design a cabin to unlock the front doors, all before the night guard returns."),
        h("ul",{class:"rules"},
          h("li",{},"Play in teams of 3 to 5. Split up the puzzles on each floor, then share what you learn."),
          h("li",{},"Four of the exhibits on each floor hide a task. Click a glowing exhibit to open it on its own page."),
          h("li",{},"Every solved puzzle reveals one digit. Follow the plaque&rsquo;s rule to turn the four digits into the keypad code."),
          h("li",{},"The finale is a cabin design challenge. No architecture experience is needed on the easier levels."),
          h("li",{},`The target time is ${TARGET_MIN} minutes on the team clock. Your level changes how fast the clock runs.`))),
      h("div",{html:skyline})),
    h("section",{class:"setup"},
      h("h2",{},"Set up your team"),
      h("div",{class:"teamrow"},input),
      h("h3",{},"Choose a difficulty"),
      h("p",{},"The harder the level, the less help you get, and the slower your team clock runs. The easier the level, the more help you get, and the faster your clock runs."),
      grid,
      h("p",{class:"muted"},"Stuck or confident? You can switch levels at any time with the level button at the top of the screen. Going easier makes your clock run faster from that moment on, and going harder makes it run slower. Time already on the clock never changes."),
      h("div",{class:"actions"},h("button",{class:"btn",type:"button",onclick:go},"Begin the escape")))));
}

function titleBlock(R,view,note){
  const cell=(k,v)=>h("div",{},h("small",{},k),h("span",{},v));
  return h("div",{class:"titleblock"},
    cell("Project","Skyline Museum of Architecture"),
    cell("Level",`Floor ${R.floor} of 5`),
    cell("View",view),
    cell("Scale","Not to scale"),
    cell("Progress",note));
}
function openPuzzle(i){ const R=ROOMS[S.room]; location.hash="#/floor"+R.floor+"/"+R.puzzles[i].id; }
function closePuzzle(){ const R=ROOMS[S.room]; location.hash="#/floor"+R.floor; }
function syncFromHash(){
  if(S.screen!=="room") return null;
  const m=location.hash.match(/^#\/floor(\d)\/(\w+)$/);
  if(m){ const R=ROOMS[S.room]; if(+m[1]===R.floor){ const i=R.puzzles.findIndex(p=>p.id===m[2]); if(i>=0) return i; } }
  return null;
}
window.addEventListener("hashchange",()=>{
  if(S.screen!=="room") return;
  const np=syncFromHash(); if(np!==S.puzzle){ S.puzzle=np; render(); window.scrollTo(0,0); }
});

function roomScreen(){
  const R = ROOMS[S.room], total = R.puzzles.length;
  const solvedCount = R.puzzles.filter(p=>S.solved[p.id]).length, done = solvedCount===total;
  const scene = sceneEl(S.room, done?"ready":"locked", `Floor ${R.floor}: ${R.name}`,
    {spots:true, flush:true, solved:R.puzzles.map(p=>!!S.solved[p.id]), titles:R.puzzles.map(p=>p.title), ready:done},
    k=>{ if(k==="key"){ const l=document.getElementById("lockholder"); l.scrollIntoView({behavior:"smooth",block:"center"}); const inp=l.querySelector("input"); if(inp) inp.focus({preventScroll:true}); } else openPuzzle(+k); });

  const tasks = h("section",{class:"panel"},
    h("h3",{},"Tasks on this floor"),
    h("p",{},`${solvedCount} of ${total} solved. Click a glowing exhibit in the gallery, or pick a task here.`),
    h("ul",{class:"tasklist"}, R.puzzles.map((p,i)=>{
      const d=!!S.solved[p.id];
      return h("li",{},h("button",{class:"taskbtn"+(d?" done":""),type:"button",onclick:()=>openPuzzle(i)},
        h("span",{class:"tn"},d?"✓":String(i+1)), h("span",{},p.title), h("span",{class:"ts"},d?`Solved: digit ${p.digit}`:"Open task")));
    })));

  const lockHolder = h("div",{id:"lockholder"});
  const digitsRow = h("div",{class:"digits"}, R.puzzles.map((p,i)=>h("div",{class:"dg"+(S.solved[p.id]?" on":"")},h("small",{},`#${i+1}`),h("b",{},S.solved[p.id]?p.digit:"?"))));
  const msg = h("div",{class:"msg",role:"status","aria-live":"polite"});
  const box = h("section",{class:"lock"},
    h("h3",{},"Stairwell keypad"),
    h("p",{html:`<b>Plaque:</b> ${R.rule.text}`}),
    digitsRow,
    done ? null : h("p",{},`Solve all ${total} tasks to reveal every digit. ${solvedCount} of ${total} solved.`));
  if(done){
    const input = h("input",{type:"text",inputmode:"numeric",maxlength:"4",autocomplete:"off","aria-label":"Four-digit code"});
    const code = R.rule.fn(R.puzzles.map(p=>p.digit)).join("");
    const tryIt = () => {
      if(input.value.trim()===code){
        S.letters.push(R.letter); S.screen = S.room===ROOMS.length-1 ? "exit" : "transition"; save(); render(); window.scrollTo(0,0);
      } else {
        msg.className="msg bad"; msg.textContent="The keypad buzzes. Re-read the plaque rule and check the order of your digits.";
        box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
      }
    };
    input.addEventListener("keydown",e=>{ if(e.key==="Enter") tryIt(); });
    box.append(h("div",{class:"codein"},input,h("button",{class:"btn",type:"button",onclick:tryIt},"Enter code")),msg);
  }
  lockHolder.append(box);

  const main = h("main",{},
    scene,
    titleBlock(R,`Interior perspective: ${R.name}`,`${solvedCount} of ${total} tasks`),
    h("p",{class:"scenehint",html:"Click the <b>numbered glowing exhibits</b> to open each task. Hover over one to see what it is."}),
    h("section",{class:"panel"},
      h("div",{class:"floor-tag"},`Floor ${R.floor} of 5`),
      h("h2",{},R.name),
      h("p",{class:"story",html:R.story})),
    guide(R,LEVELS[S.level].guideOpen), tasks, lockHolder);
  return h("div",{},topbar(),h("div",{class:"layout wrap"},floorNav(),main),footer());
}

function refBox(p){
  const lv=LEVELS[S.level]; if(lv.lesson==="none") return null;
  const full=lv.lesson==="full", html=full?REFS[p.id]:QUICK[p.id]; if(!html) return null;
  return h("details",{class:"ref",open:true},h("summary",{html:full?"Learn it first: Juno&rsquo;s field notes":"Quick facts for this task"}),h("div",{class:"refbody",html}));
}
function puzzleScreen(){
  const R = ROOMS[S.room], i = S.puzzle, p = R.puzzles[i], sp = SCN.spots(S.room)[i];
  const closeUp = h("div",{class:"scene-wrap flush"},h("div",{html:SCN.draw(S.room,"locked",{crop:sp})}),h("div",{class:"scene-tag"},sp.l));
  const after = h("div",{class:"after"});
  const drawAfter = () => {
    after.replaceChildren();
    if(!S.solved[p.id]) return;
    const nx = R.puzzles.findIndex((q,k)=>k!==i && !S.solved[q.id]);
    after.append(h("div",{class:"actions"},
      nx>=0 ? h("button",{class:"btn",type:"button",onclick:()=>openPuzzle(nx)},`Next exhibit: ${R.puzzles[nx].title}`) : null,
      h("button",{class:nx>=0?"btn ghost":"btn",type:"button",onclick:closePuzzle},nx>=0?"Back to the gallery":"Back to the gallery and the keypad")));
  };
  const host = h("div",{});
  host.append(S.solved[p.id] ? solvedCard(p,i+1) : activeCard(p,i+1,R.puzzles.length,card=>{ card.replaceWith(solvedCard(p,i+1)); drawAfter(); }));
  drawAfter();
  return h("div",{},topbar(),
    h("div",{class:"page"},
      h("div",{class:"crumbs"},h("button",{class:"btn ghost",type:"button",onclick:closePuzzle},"Back to the gallery")),
      h("p",{class:"floor-tag"},`Floor ${R.floor}: ${R.name}`),
      closeUp, titleBlock(R,`Detail view: ${sp.l}`,`Task ${i+1} of ${R.puzzles.length}`), refBox(p), host, after,
      h("div",{style:"margin-top:22px"},guide(R,false))),
    footer());
}

function guide(R,open){
  return h("details",{class:"guide",open:open},
    h("summary",{},"Gallery guide: facts for this floor"),
    h("div",{class:"placards"},R.guide.map(g=>h("div",{class:"placard"},h("h4",{html:g.t}),h("p",{html:g.p})))));
}

function transitionScreen(){
  const R = ROOMS[S.room], nxt = ROOMS[S.room+1];
  return h("div",{},topbar(),
    h("div",{class:"layout wrap"},floorNav(),
      h("main",{},sceneEl(S.room,"open",`Floor ${R.floor}: ${R.name}`),h("section",{class:"panel"},
        h("h2",{},"The door opens"),
        h("p",{class:"story",html:R.outro}),
        h("p",{class:"skillnote",html:`<b>Skill unlocked:</b> ${R.skill}`}),
        h("div",{class:"keycards"},...keycards()),
        h("p",{},`Next stop: Floor ${nxt.floor}, ${nxt.name}.`),
        h("button",{class:"btn",type:"button",onclick:()=>{S.room++; S.screen="room"; S.puzzle=null; save(); render(); window.scrollTo(0,0);}},`Go down to Floor ${nxt.floor}`)
      ))),
    footer());
}

function exitScreen(){ return studioScreen(); }

function winScreen(){
  const mins = Math.floor(elapsed()/60000), hints = hintTotal();
  const path=[(S.log[0]?S.log[0].from:S.level),...S.log.map(l=>l.to)].map(k=>LEVELS[k].label).join(", then ");
  let rank = "Intern architect";
  if(mins<=TARGET_MIN && hints<=8) rank = "Principal architect";
  else if(mins<=TARGET_MIN+15 && hints<=14) rank = "Project architect";
  return h("div",{},topbar(),
    h("div",{class:"wrap"},h("div",{class:"center"},
      sceneEl(4,"open","The street"),
      h("h1",{style:"margin-top:22px"},"You escaped!"),
      h("p",{class:"story"},"The front doors swing open and cool night air rushes in. You made it down five floors by thinking like architects."),
      h("div",{class:"cert"},
        h("h2",{},"Certificate of escape"),
        h("p",{},"This certifies that the team"),
        h("div",{class:"big"},S.team),
        h("p",{},`escaped the ${MUSEUM} with a team clock time of`),
        h("div",{class:"big"},fmt(elapsed())),
        h("p",{},`using ${hints} hint${hints===1?"":"s"}, earning the rank of`),
        h("div",{class:"big"},rank),
        h("p",{class:"certnote"},`Real time: ${fmt(realElapsed())}. Difficulty: ${path}.`)),
      h("button",{class:"btn",type:"button",onclick:()=>window.print()},"Print certificate"),
      S.cabin&&S.cabin.items&&S.cabin.items.length?h("div",{class:"panel",style:"margin-top:26px"},h("h3",{},"Your approved cabin design"),h("div",{class:"planbox",html:planSVG(S.cabin,null,false,new Set())}),h("p",{class:"muted"},"The five keycard letters spell BUILD: first you learn, then you design, then you build.")):null,
      h("div",{class:"panel",style:"margin-top:26px"},
        h("h3",{},"What you just practiced"),
        h("ul",{class:"rules"},
          ...ROOMS.map((r,i)=>h("li",{},h("b",{},`Floor ${r.floor}: `),FACULTY[i][1])))),
      h("div",{class:"panel"},
        h("h3",{},"Could this be your career?"),
        h("p",{},"Architects mix creativity, math, drawing, teamwork, and communication. If you enjoyed the puzzles, you already used many of the skills they use every day."),
        h("p",{html:`The path usually includes an accredited degree, supervised work experience, and a licensing exam. To learn more, explore <a href="https://www.aia.org" target="_blank" rel="noopener">the American Institute of Architects</a> and <a href="https://www.ncarb.org" target="_blank" rel="noopener">NCARB</a>.`})),
      h("div",{class:"panel"},
        h("h3",{},"Talk it over with your team"),
        h("ul",{class:"rules"},
          h("li",{},"Which puzzle felt most like real design work? Why?"),
          h("li",{},"Which architect or building would you like to learn more about?"),
          h("li",{},"What building in your own town would you redesign, and what problem would you solve?"))),
      h("button",{class:"btn ghost",type:"button",onclick:()=>{S=fresh();save();render();}},"Play again")
    )));
}

function confetti(){
  const c=h("div",{class:"confetti","aria-hidden":"true"}); const cols=["#ffc66e","#79d6a8","#9fd0f0","#ff9a88","#c9b6ff"];
  for(let i=0;i<46;i++) c.append(h("span",{style:`left:${(i*37)%100}%;background:${cols[i%5]};animation-delay:${(i%12)*.18}s;animation-duration:${3+(i%5)*.5}s`}));
  return c;
}
document.addEventListener("keydown",e=>{ if(window.STUDIO_KEYS) window.STUDIO_KEYS(e); });
function render(){
  let el;
  if(S.screen!=="room"){ S.puzzle=null; if(location.hash){ try{history.replaceState(null,"",location.pathname+location.search);}catch(e){} } }
  switch(S.screen){
    case "room": el = (S.puzzle!==null && S.puzzle!==undefined) ? puzzleScreen() : roomScreen(); break;
    case "transition": el = transitionScreen(); break;
    case "exit": el = exitScreen(); break;
    case "win": el = winScreen(); el.append(confetti()); break;
    default: el = startScreen();
  }
  app.replaceChildren(el);
}

S.puzzle = syncFromHash();
let _saveTick=0;
setInterval(()=>{
  tick(); if(S.start&&!S.end&&++_saveTick%10===0) save();
  const t = document.getElementById("timer");
  if(t && S.start && !S.end){
    const e = elapsed(); t.textContent = fmt(e);
    const late = e >= TARGET_MIN*60000;
    t.classList.toggle("late",late);
    const b = document.getElementById("late"); if(b) b.hidden = !late;
  }
},1000);

render();
