<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escape the Skyline Museum of Architecture</title>
<meta name="description" content="A 60-minute team escape room that introduces 9th graders to architecture as a career.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Josefin+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0e1319; --ink2:#161d26;
  --line:#e7eaee; --line-dim:rgba(231,234,238,.3);
  --paper:#f1f3f5; --paperink:#161c24;
  --lead:#ffc66e; --ok:#79d6a8; --bad:#ff9a88; --muted:#a5afba;
  --head:"Josefin Sans","Avenir Next","Century Gothic",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; color:var(--line); font:16px/1.55 var(--body);
  background:radial-gradient(1300px 700px at 50% -8%,#2a3646 0%,#151c26 55%,#0d1218 100%) fixed; min-height:100vh;
}
h1,h2,h3{font-family:var(--head); font-weight:600; line-height:1.15; margin:0 0 .5em; letter-spacing:.01em}
h1{font-size:clamp(2.2rem,6vw,3.8rem); font-weight:500; letter-spacing:.015em}
h2{font-size:clamp(1.6rem,3.5vw,2.3rem)}
h3{font-size:1.25rem}
p{margin:0 0 .8em}
a{color:var(--lead)}
:focus-visible{outline:3px solid var(--lead); outline-offset:2px}
.wrap{max-width:1120px; margin:0 auto; padding:0 18px}

/* top bar */
.top{position:sticky; top:0; z-index:10; background:rgba(12,17,23,.96); border-bottom:1.5px solid var(--line-dim)}
.top .wrap{display:flex; flex-wrap:wrap; gap:8px 22px; align-items:center; justify-content:space-between; padding-top:10px; padding-bottom:10px}
.brand{font-family:var(--head); font-weight:700; font-size:1.05rem}
.stats{display:flex; gap:18px; align-items:center; flex-wrap:wrap; font-size:.95rem; color:var(--muted)}
.stats b{color:var(--line); font-weight:600}
#timer{font-family:var(--head); font-size:1.3rem; color:var(--lead); font-variant-numeric:tabular-nums}
#timer.late{color:var(--bad)}
.late-banner{background:var(--bad); color:#3a0b04; text-align:center; font-weight:600; padding:6px 12px}

/* layout */
.layout{display:grid; grid-template-columns:150px 1fr; gap:28px; padding-top:26px; padding-bottom:50px; align-items:start}
@media(max-width:820px){.layout{grid-template-columns:1fr}}

/* building section nav */
.section-nav{position:sticky; top:74px; display:flex; flex-direction:column; border:1.5px solid var(--line); background:rgba(16,22,30,.85)}
.section-nav .roof{height:22px; border-bottom:1.5px solid var(--line); background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line-dim) 6px 7px)}
.fl{padding:10px 10px 10px 12px; border-bottom:1.5px dashed var(--line-dim); font-size:.82rem; line-height:1.25; color:var(--muted); display:flex; gap:8px; align-items:center}
.fl:last-child{border-bottom:0}
.fl .n{font-family:var(--head); font-weight:700; font-size:1.4rem; width:1.1em; text-align:center; color:var(--muted)}
.fl.done{border-bottom-style:solid; color:var(--line)}
.fl.done .n{color:var(--ok)}
.fl.now{background:var(--lead); color:var(--ink); border-bottom-style:solid}
.fl.now .n{color:var(--ink)}
@media(max-width:820px){
  .section-nav{position:static; flex-direction:row-reverse}
  .section-nav .roof{display:none}
  .fl{flex:1; flex-direction:column; text-align:center; border-bottom:0; border-left:1.5px dashed var(--line-dim); padding:6px 2px}
  .fl .t{display:none}
  .fl:last-child{border-left:0}
}

/* panels */
.panel{border:1.5px solid var(--line-dim); background:rgba(16,22,30,.9); padding:20px 22px; margin-bottom:22px}
.story{font-size:1.08rem; max-width:68ch}
.floor-tag{color:var(--lead); font-family:var(--head); font-weight:700; margin-bottom:.3em}

/* gallery guide placards */
details.guide{margin-bottom:22px; border:1.5px solid var(--line-dim); background:rgba(16,22,30,.9)}
details.guide>summary{cursor:pointer; padding:14px 22px; font-family:var(--head); font-weight:700; font-size:1.2rem; list-style:none}
details.guide>summary::before{content:"▸"; display:inline-block; margin-right:10px; color:var(--lead); transition:transform .15s}
details.guide[open]>summary::before{transform:rotate(90deg)}
.placards{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; padding:4px 22px 22px}
.placard{background:var(--paper); color:var(--paperink); border-left:6px solid var(--lead); padding:12px 14px; font-size:.93rem; line-height:1.5}
.placard h4{font-family:var(--head); font-size:1.08rem; margin:0 0 .3em}
.placard p{margin:0}

/* puzzles */
.puzzle{border:1.5px solid var(--line); background:rgba(16,22,30,.94); padding:20px 22px; margin-bottom:22px}
.puzzle .ph{display:flex; justify-content:space-between; gap:12px; align-items:baseline; flex-wrap:wrap; margin-bottom:.4em}
.puzzle .ph .pn{color:var(--muted); font-size:.9rem}
.puzzle.solved{border-color:var(--ok); border-style:solid}
.puzzle.solved h3::after{content:" ✓"; color:var(--ok)}
.digit{display:inline-flex; align-items:center; gap:8px; background:var(--lead); color:var(--ink); padding:4px 12px; font-weight:600; font-family:var(--head); font-size:1.05rem}
.prompt{max-width:70ch}
.frow,.mrow{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,260px); gap:8px 16px; align-items:center; margin:10px 0}
@media(max-width:640px){.frow,.mrow{grid-template-columns:1fr}}
input[type=text],input[type=number],select{
  width:100%; font:inherit; color:var(--ink); background:#fff; border:2px solid transparent; padding:8px 10px; border-radius:0
}
input.ok{border-color:var(--ok)} input.no{border-color:var(--bad)}
.orderlist{list-style:none; padding:0; margin:12px 0; counter-reset:o}
.orderlist li{display:flex; justify-content:space-between; gap:12px; align-items:center; background:rgba(255,255,255,.07); border:1.5px solid var(--line-dim); padding:8px 10px; margin-bottom:6px; counter-increment:o}
.orderlist li .otext::before{content:counter(o) ". "; color:var(--lead); font-weight:600}
.obtns{display:flex; gap:4px}
.mini{font:inherit; width:34px; height:34px; background:transparent; color:var(--line); border:1.5px solid var(--line); cursor:pointer}
.mini:hover:not(:disabled){background:var(--line); color:var(--ink)}
.mini:disabled{opacity:.3; cursor:default}
.pickrow{display:flex; gap:10px; align-items:flex-start; padding:8px 10px; margin-bottom:6px; border:1.5px solid var(--line-dim); background:rgba(255,255,255,.07); cursor:pointer}
.pickrow input{margin-top:5px; width:18px; height:18px; accent-color:var(--lead)}
.actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px}
.btn{font:inherit; font-weight:600; background:var(--lead); color:var(--ink); border:2px solid var(--lead); padding:9px 18px; cursor:pointer}
.btn:hover{background:#ffe07d}
.btn.ghost{background:transparent; color:var(--line); border-color:var(--line-dim)}
.btn.ghost:hover{border-color:var(--line); background:rgba(255,255,255,.08)}
.msg{min-height:1.4em; margin-top:10px; font-weight:500}
.msg.good{color:var(--ok)} .msg.bad{color:var(--bad)}
.hints .hint{background:rgba(255,198,110,.12); border-left:4px solid var(--lead); padding:8px 12px; margin:8px 0 0; font-size:.95rem}
.reveal{background:rgba(121,214,168,.1); border-left:4px solid var(--ok); padding:8px 12px; margin-top:8px}
.cipher{font-family:var(--head); font-size:1.7rem; letter-spacing:.14em; background:rgba(255,255,255,.07); border:1.5px dashed var(--line-dim); padding:12px 16px; margin:12px 0; word-break:break-word}
.tablewrap{overflow-x:auto}
table.prog{border-collapse:collapse; margin:10px 0; background:var(--paper); color:var(--paperink)}
table.prog th,table.prog td{border:1px solid #9bb4cc; padding:6px 12px; text-align:left}
table.prog th{background:#dbe7f2}
.paper{background:#fbf9f3; color:var(--paperink); padding:12px; margin:12px 0; max-width:520px}
.paper svg{display:block; width:100%; height:auto}
.legend{font-size:.88rem; margin:6px 0 0}

/* gallery scene */
.scene-wrap{position:relative; border:1.5px solid var(--line); margin-bottom:22px; background:#0b1016; line-height:0; overflow:hidden}
.scene-wrap svg{display:block; width:100%; height:auto; min-height:190px; max-height:420px}
.scene-tag{position:absolute; left:50%; bottom:0; transform:translateX(-50%); background:var(--lead); color:var(--ink); font-family:var(--head); font-weight:700; padding:4px 18px; line-height:1.3; font-size:1rem; white-space:nowrap; pointer-events:none}
.rain{animation:rain 1.4s linear infinite}
@keyframes rain{from{transform:translate(0,-5px); opacity:.15}50%{opacity:.7}to{transform:translate(-2px,7px); opacity:.1}}
.flick{animation:flick 3.2s steps(1) infinite}
@keyframes flick{0%,100%{opacity:1}46%{opacity:.55}50%{opacity:1}}

/* drawing-sheet title block */
.scene-wrap.flush{margin-bottom:0}
.titleblock{display:grid; grid-template-columns:1.7fr .9fr 1.5fr .9fr .9fr; border:1.5px solid var(--line); border-top:1px solid var(--line-dim); margin-bottom:22px; background:rgba(14,19,25,.94)}
.titleblock>div{padding:7px 14px; border-left:1px solid var(--line-dim); min-width:0}
.titleblock>div:first-child{border-left:0}
.titleblock small{display:block; color:var(--muted); font-size:.74rem; line-height:1.2}
.titleblock span{display:block; font-family:var(--head); font-weight:600; font-size:.92rem; line-height:1.3}
@media(max-width:700px){.titleblock{grid-template-columns:1fr 1fr}.titleblock>div:nth-child(odd){border-left:0}.titleblock>div:nth-child(n+3){border-top:1px solid var(--line-dim)}}

/* hotspots */
.hot{cursor:pointer; outline:none}
.hot .hr{fill:rgba(255,198,110,.04); stroke:#ffc66e; stroke-width:2; stroke-dasharray:6 4}
.hot:hover .hr,.hot:focus-visible .hr{fill:rgba(255,198,110,.22)}
.hot:focus-visible .hr{stroke:#fff; stroke-width:3}
.hot.done .hr{stroke:#6fd3a0; fill:rgba(121,214,168,.08)}
.hot.key .hr{stroke:#ff8f7e}
.hot.key.done .hr{stroke:#6fd3a0}
.hot .badge circle{fill:#ffc66e; stroke:#0e1319; stroke-width:2.5}
.hot.done .badge circle{fill:#6fd3a0}
.hot .badge text{fill:#0e1319; font:700 16px "Josefin Sans",sans-serif; text-anchor:middle; dominant-baseline:central}
.hot.todo .badge{animation:pulse 2.2s ease-in-out infinite; transform-box:fill-box; transform-origin:center}
@keyframes pulse{50%{transform:scale(1.2)}}
.hot .lab{opacity:0; pointer-events:none; transition:opacity .15s}
.hot:hover .lab,.hot:focus-visible .lab{opacity:1}
.hot .lab rect{fill:#0e1319; stroke:#ffc66e; stroke-width:1.5}
.hot .lab text{fill:#ffc66e; font:600 12px "IBM Plex Sans",sans-serif; text-anchor:middle; dominant-baseline:central}
.scenehint{margin:-8px 0 20px; color:var(--muted)}
.scenehint b{color:var(--lead)}
.tasklist{list-style:none; padding:0; margin:12px 0 0; display:grid; gap:8px}
.taskbtn{width:100%; display:grid; grid-template-columns:38px 1fr auto; gap:12px; align-items:center; text-align:left; font:inherit; color:var(--line); background:rgba(255,255,255,.06); border:1.5px solid var(--line-dim); padding:10px 12px; cursor:pointer}
.taskbtn:hover{border-color:var(--lead)}
.taskbtn .tn{font-family:var(--head); font-weight:700; font-size:1.3rem; background:var(--lead); color:var(--ink); width:34px; height:34px; display:flex; align-items:center; justify-content:center}
.taskbtn.done .tn{background:var(--ok)}
.taskbtn .ts{color:var(--muted); font-size:.9rem}
.page{max-width:860px; margin:0 auto; padding:22px 18px 50px}
.page .crumbs{margin-bottom:14px}
.after{margin-top:18px}

/* lock */
.lock{border:2px solid var(--lead); background:rgba(16,22,30,.96); padding:22px}
.digits{display:flex; gap:10px; margin:12px 0; flex-wrap:wrap}
.dg{width:66px; height:76px; border:1.5px dashed var(--line-dim); display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--muted)}
.dg small{font-size:.78rem}
.dg b{font-family:var(--head); font-size:2rem; line-height:1}
.dg.on{border-style:solid; border-color:var(--lead); color:var(--lead)}
.codein{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px}
.codein input{width:150px; font-family:var(--head); font-size:1.6rem; letter-spacing:.3em; text-align:center}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* start / transition / win */
.hero{display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr); gap:34px; align-items:center; padding:46px 0}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.hero p.lead{font-size:1.15rem; max-width:56ch}
.rules{padding-left:1.1em; max-width:60ch}
.rules li{margin-bottom:.4em}
.teamrow{display:flex; gap:10px; flex-wrap:wrap; margin:18px 0 6px}
.teamrow input{max-width:300px}
.keycards{display:flex; gap:10px; margin:14px 0; flex-wrap:wrap}
.kc{width:62px; height:78px; background:var(--paper); color:var(--ink); border-left:6px solid var(--lead); display:flex; align-items:center; justify-content:center; font-family:var(--head); font-weight:700; font-size:2rem}
.kc.empty{background:transparent; color:var(--muted); border:1.5px dashed var(--line-dim); border-left:1.5px dashed var(--line-dim)}
.center{max-width:720px; margin:40px auto}
.cert{background:var(--paper); color:var(--paperink); padding:34px 30px; border:6px double var(--ink); text-align:center; margin:22px 0}
.cert h2{color:var(--ink)}
.cert .big{font-family:var(--head); font-size:2rem; font-weight:700; margin:.2em 0}
.two{display:grid; grid-template-columns:1fr 1fr; gap:22px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.foot{border-top:1.5px solid var(--line-dim); background:rgba(12,17,23,.96); padding:12px 0; position:sticky; bottom:0}
.foot .wrap{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.foot .kc{width:34px; height:42px; font-size:1.2rem; border-left-width:4px}
.foot span.lbl{color:var(--muted); font-size:.9rem}

@media(max-width:640px){.foot{position:static}}
@media print{
  body{background:#fff}
  body *{visibility:hidden}
  .cert,.cert *{visibility:visible}
  .cert{position:absolute; left:0; top:0; width:100%; margin:0}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important; scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   GAME CONTENT
   Edit text, hints and answers in this section.
   ============================================================ */
const MUSEUM = "Skyline Museum of Architecture";
const TARGET_MIN = 60;

const FLOOR_PLAN_SVG = `
<svg viewBox="0 0 440 290" role="img" aria-label="Floor plan of a small house with three rooms: a living room on the left, a bedroom top right, and a bathroom bottom right">
  <rect width="440" height="290" fill="#fbf9f3"/>
  <rect x="30" y="30" width="380" height="220" fill="none" stroke="#12263d" stroke-width="8"/>
  <path d="M220 30V70M220 110V250M220 140H300M340 140H410" stroke="#12263d" stroke-width="6" fill="none"/>
  <!-- windows -->
  <g fill="#fbf9f3" stroke="#12263d" stroke-width="1.5">
    <rect x="70" y="26" width="80" height="8"/><line x1="70" y1="30" x2="150" y2="30"/>
    <rect x="26" y="110" width="8" height="60"/><line x1="30" y1="110" x2="30" y2="170"/>
    <rect x="270" y="26" width="80" height="8"/><line x1="270" y1="30" x2="350" y2="30"/>
    <rect x="270" y="246" width="80" height="8"/><line x1="270" y1="250" x2="350" y2="250"/>
  </g>
  <!-- doors -->
  <rect x="70" y="245" width="40" height="10" fill="#fbf9f3"/>
  <g stroke="#12263d" fill="none">
    <line x1="70" y1="250" x2="70" y2="210" stroke-width="2.5"/><path d="M70 210A40 40 0 0 1 110 250" stroke-width="1"/>
    <line x1="220" y1="70" x2="180" y2="70" stroke-width="2.5"/><path d="M180 70A40 40 0 0 0 220 110" stroke-width="1"/>
    <line x1="300" y1="140" x2="300" y2="100" stroke-width="2.5"/><path d="M300 100A40 40 0 0 1 340 140" stroke-width="1"/>
  </g>
  <g font-family="Georgia,serif" font-size="16" fill="#12263d" text-anchor="middle">
    <text x="125" y="150">Living Room</text>
    <text x="320" y="88">Bedroom</text>
    <text x="320" y="205">Bathroom</text>
  </g>
</svg>`;

const ROOMS = [
/* ---------------- FLOOR 5 ---------------- */
{
  floor:5, short:"What is architecture?", name:"The Skyline Gallery",
  story:`Rain taps on the glass dome of Floor 5. The museum has locked down for the night, the elevators are dead, and the only way out is the stairwell door at the end of this gallery. It has a four-digit keypad. The wall plaques explain what architecture is. Read them, then click the glowing exhibits to open and solve the four tasks. Each task reveals one digit.`,
  guide:[
    {t:"Architecture, defined", p:`Architecture is the art and science of designing buildings and the spaces around them so people can live, learn, work, heal, and gather in them. Architects mix creativity with math, science, safety rules, budgets, and a deep understanding of people.`},
    {t:"The three qualities of a good building", p:`More than 2,000 years ago the Roman writer Vitruvius said a good building needs three things: <b>Firmitas</b> (it is strong and lasts), <b>Utilitas</b> (it is useful and works well for the people inside), and <b>Venustas</b> (it is beautiful and delights the senses).`},
    {t:"Architects zoom in and out", p:`In one project an architect may think about the tiny details of a door handle, the shape of a room, the whole building, the site it sits on, and even how it fits into a neighborhood or city.`},
    {t:"Specialties", p:`Many people work in design. <b>Building architects</b> design homes, schools, and offices. <b>Landscape architects</b> shape parks, plazas, and gardens. <b>Interior designers</b> plan the inside spaces. <b>Urban planners</b> decide how neighborhoods and cities grow. <b>Structural engineers</b> calculate how structures carry their weight.`},
    {t:"The Caesar disk", p:`A famous old trick for secret messages is the Caesar cipher: every letter is shifted along the alphabet by a fixed number. The brass disk by the keypad is set to <b>3</b>. That means A became D, B became E, and so on.`}
  ],
  puzzles:[
    {
      id:"1a", title:"The three pillars", type:"multi", digit:4,
      prompt:`Three buildings in the gallery are each missing one of Vitruvius&rsquo;s three qualities. Name the missing quality in plain English (one word each).`,
      fields:[
        {label:`<b>A.</b> A dazzling glass footbridge that cracks and collapses in the first big storm.`, answers:["strength","firmitas","durability","strong","stability","firmness"]},
        {label:`<b>B.</b> A gorgeous, solid museum with no ramps or elevators and exits hidden behind exhibits.`, answers:["usefulness","utility","utilitas","function","functionality","useful","purpose"]},
        {label:`<b>C.</b> A strong, efficient windowless block that students dread entering every morning.`, answers:["beauty","venustas","delight","aesthetics","beautiful","appearance"]}
      ],
      hints:[`Look at the three words on the second placard. Each one has an English meaning in parentheses.`,`A is missing Firmitas, B is missing Utilitas, and C is missing Venustas. Now translate each into one English word.`],
      reveal:`Great buildings balance all three: strong, useful, and beautiful. Architects constantly trade these off against each other and against cost.`
    },
    {
      id:"1b", title:"Zoom out", type:"order", digit:7,
      prompt:`Put these things in order from the <b>smallest</b> scale an architect thinks about to the <b>largest</b>.`,
      items:[`The design of a door handle`,`A single room`,`A whole building`,`The site: the building, parking, and landscape together`,`A neighborhood or city plan`],
      start:[1,3,4,0,2],
      hints:[`Start with the thing you could hold in your hand.`,`Handle, room, building, site, then the whole city.`],
      reveal:`Architects switch scales all day, from millimeters to kilometers.`
    },
    {
      id:"1c", title:"The brass disk", type:"multi", digit:2,
      prompt:`A famous architectural slogan was scratched onto the wall in Caesar code. Decode it with the shift on the brass disk, then finish the slogan.
        <div class="cipher" aria-label="Encoded message">IRUP IROORZV IXQFWLRQ</div>`,
      fields:[{label:`Decoded, the slogan reads &ldquo;Form follows ______.&rdquo; Fill in the last word.`, answers:["function"]}],
      hints:[`The disk says 3, so move each letter <i>back</i> three places in the alphabet. I becomes F. R becomes O.`,`The first word decodes to FORM and the second to FOLLOWS. Keep going with the third word.`],
      reveal:`&ldquo;Form follows function&rdquo; was popularized by Chicago architect Louis Sullivan in the 1890s. It means a building&rsquo;s shape should grow out of its purpose.`
    },
    {
      id:"1d", title:"Who does what?", type:"match", digit:9,
      prompt:`Match each job description to the right design professional.`,
      pairs:[
        [`Designs the paths, plants, and seating of a city park`,`Landscape architect`],
        [`Decides where new streets and neighborhoods should go`,`Urban planner`],
        [`Plans the layout, finishes, and lighting inside a hotel lobby`,`Interior designer`],
        [`Leads the design of a school building and coordinates the whole team`,`Building architect`],
        [`Calculates whether beams and columns can safely carry the loads`,`Structural engineer`]
      ],
      options:[`Landscape architect`,`Urban planner`,`Interior designer`,`Building architect`,`Structural engineer`],
      hints:[`Two of these jobs deal with places mostly outdoors or at city scale. Start there.`,`The last one is about math and physics. Engineers calculate; architects coordinate and shape.`],
      reveal:`Architecture is a team sport. Many careers around the building share the same design world.`
    }
  ],
  rule:{text:`Enter your four digits in order from <b>smallest to largest</b>.`, fn:d=>[...d].sort((a,b)=>a-b)},
  letter:"L",
  outro:`The keypad chirps green and the stairwell door clunks open. On the landing you find a keycard fragment stamped with the letter <b>L</b>. Hang on to it.`
},
/* ---------------- FLOOR 4 ---------------- */
{
  floor:4, short:"Famous architects", name:"The Hall of Visionaries",

  guide:[
    {t:"Frank Lloyd Wright (USA, 1867&ndash;1959)", p:`Champion of &ldquo;organic architecture,&rdquo; where buildings grow out of their landscape. <b>Fallingwater</b> in Pennsylvania was built in the 1930s right over a waterfall.`},
    {t:"Antoni Gaud&iacute; (Spain, 1852&ndash;1926)", p:`Used curves, columns like tree trunks, and colorful mosaics. His <b>Sagrada Fam&iacute;lia</b> in Barcelona began in 1882 and is still being completed.`},
    {t:"J&oslash;rn Utzon (Denmark, 1918&ndash;2008)", p:`Won an international competition with sail-like shells for the <b>Sydney Opera House</b> in Australia.`},
    {t:"I. M. Pei (China/USA, 1917&ndash;2019)", p:`Added a glass-and-steel pyramid to the <b>Louvre</b> museum in Paris, which opened in 1989.`},
    {t:"Frank Gehry (Canada/USA, born 1929)", p:`Famous for sculptural, titanium-clad buildings such as the <b>Guggenheim Museum Bilbao</b> in Spain.`},
    {t:"Renzo Piano (Italy, born 1937)", p:`Co-designed the Centre Pompidou in Paris and designed The Shard in London.`},
    {t:"Zaha Hadid (Iraq/UK, 1950&ndash;2016)", p:`Known for flowing, futuristic curves, such as the Heydar Aliyev Center in Baku, Azerbaijan. She was the first woman to win the Pritzker Prize.`},
    {t:"Maya Lin (USA, born 1959)", p:`Won the competition to design the <b>Vietnam Veterans Memorial</b> in Washington, D.C. while she was still a college undergraduate. It is two polished black granite walls.`},
    {t:"Ludwig Mies van der Rohe (Germany/USA, 1886&ndash;1969)", p:`Pioneer of sleek steel-and-glass skyscrapers, including the <b>Seagram Building</b> in New York. His motto: &ldquo;Less is more.&rdquo;`},
    {t:"The Pritzker Prize", p:`Architecture&rsquo;s highest honor, often compared to the Nobel Prize. It has been awarded every year since 1979.`},
    {t:"Architect or engineer?", p:`Engineers calculate how structures stand up and survive loads. Architects shape the whole experience of a building: how it looks, works, and feels. Both are essential, and many famous structures were made by teams of both.`}

  story:`Floor 3 smells like pencil shavings and foam board. Half-built models crowd the tables and a whiteboard shows the architects&rsquo; &ldquo;design loop.&rdquo; Before you can open the next keypad you will have to think like a designer: gather information, understand a site, and make a layout work.`,
  guide:[
    {t:"The design process", p:`Architects follow steps, but they often loop back as they learn more. <b>1. Define the problem:</b> meet the client and list what they need (the &ldquo;program&rdquo;), plus budget and rules. <b>2. Research and site analysis:</b> study sun, wind, views, slope, neighbors, and zoning. <b>3. Brainstorm concepts:</b> many quick sketches and big ideas. <b>4. Schematic design:</b> pick a direction and draw rough room layouts. <b>5. Develop and refine:</b> choose materials and structure, build detailed models, coordinate with engineers. <b>6. Present and revise:</b> share with the client, take feedback, adjust.`},
    {t:"Reading a site", p:`In the Northern Hemisphere the sun stays in the southern part of the sky, so south-facing windows catch the most sunlight in winter. A <b>setback</b> is the minimum distance a building must stay back from a property line. Zoning rules set limits like height and use.`},
    {t:"The program", p:`The &ldquo;program&rdquo; is the client&rsquo;s list of required spaces, sizes, and needs. Architects add extra space for hallways and walls, often about 20% beyond the total of the room areas.`},
    {t:"Bubble diagrams", p:`A bubble diagram is a quick sketch of circles that shows which spaces should be next to each other (like a kitchen near a garage) and which should be far apart (like bedrooms away from noise).`}

{
  floor:2, short:"Drawing types", name:"The Drafting Room",
  story:`Floor 2 is lined with drafting tables, rolled blueprints, and scale rulers. A flickering lamp lights a half-finished set of drawings. The keypad light is dim, but the drawings might still teach you how to turn it bright.`,
  guide:[
    {t:"Site plan", p:`A bird&rsquo;s-eye view of the whole property. It shows the building outline, driveway, trees, and the north arrow.`},
    {t:"Floor plan", p:`A horizontal slice through the building about four feet above the floor, looking straight down. It shows walls, doors, windows, and room names.`},
    {t:"Elevation", p:`A straight-on view of one outside face of the building (front, back, or sides). It shows heights, windows, and materials with no perspective.`},
    {t:"Section", p:`A vertical slice through the building, like cutting a cake. It shows floor heights, ceilings, stairs, and how the parts connect.`},
    {t:"Perspective", p:`A realistic 3D-style view with vanishing points. Perspectives help clients picture what a building will feel like.`},
    {t:"Detail drawing", p:`A large close-up that shows how pieces connect, such as where the roof meets the wall.`},
    {t:"The language of lines", p:`<b>Heavy solid</b> lines show walls that are cut. <b>Dashed</b> lines show hidden or overhead things. <b>Dash-dot</b> (chain) lines mark centerlines. <b>Thin solid</b> lines with arrows and numbers are dimensions, meaning measurements.`},
    {t:"Scale", p:`Drawings are smaller than real buildings, so they use a scale. At <b>1/4&Prime; = 1&prime;-0&Prime;</b>, every quarter inch on paper equals one foot in real life. That means 1 inch on paper equals 4 feet. At <b>1/8&Prime; = 1&prime;-0&Prime;</b>, 1 inch equals 8 feet.`}
  ],
  puzzles:[

      reveal:`A full set of drawings tells builders everything. No single view is enough.`
    },
    {
      id:"4b", title:"Scale math", type:"multi", digit:1,
      prompt:`Use the ruler on the table. Remember that at 1/4&Prime; = 1&prime;-0&Prime; one inch on paper is 4 feet.`,
      fields:[
        {label:`<b>A.</b> On a 1/4&Prime; = 1&prime;-0&Prime; drawing, a hallway measures 7 inches. How many feet long is the real hallway?`, num:28, ph:"Feet"},
        {label:`<b>B.</b> At the same scale, a room is 15 feet wide. How many inches wide is it on the drawing? (Decimals are fine.)`, num:3.75, ph:"Inches"},
        {label:`<b>C.</b> On a 1/8&Prime; = 1&prime;-0&Prime; drawing, a building face measures 4 inches. How many feet wide is the real building?`, num:32, ph:"Feet"}

      hints:[`Convert: at 1/4&Prime; scale, 1 inch is 4 ft. At 1/8&Prime; scale, 1 inch is 8 ft.`,`A: 7 &times; 4. B: 15 &divide; 4. C: 4 &times; 8.`],

        <div class="paper">${FLOOR_PLAN_SVG}</div>

      reveal:`Floor plans pack lots of information into simple symbols. After a little practice you can &ldquo;walk through&rdquo; a plan in your head.`
    },
    {
      id:"4d", title:"The language of lines", type:"match", digit:3,
      prompt:`Line weight and style carry meaning. Match each line to what it shows.`,
      pairs:[
        [`A <b>heavy solid</b> line`,`Walls that are cut by the drawing`],

      hints:[`Re-read the &ldquo;language of lines&rdquo; placard.`,`Heavy means cut. Dashed means hidden. Dash-dot means center. Thin with arrows means measurement.`],

  guide:[
    {t:"Phases of an architect&rsquo;s work (alphabetical)", p:`<b>Bidding and negotiation:</b> contractors price the job and the client picks a builder. <b>Construction administration:</b> the architect visits the site, answers questions, reviews the contractor&rsquo;s work, and checks quality until the building is done. <b>Construction documents:</b> complete drawings and written specifications used for permits, pricing, and building. <b>Design development:</b> materials, structure, and systems are chosen and detailed. <b>Programming (pre-design):</b> learn what the client needs, plus budget and schedule. <b>Schematic design:</b> rough layouts and the big idea.`},
    {t:"Words you will hear on a job site", p:`An <b>RFI</b> (request for information) is a question from the contractor when something in the drawings is unclear. A <b>submittal</b> is a sample or product data the contractor sends for approval before ordering. A <b>change order</b> is a written change to the contract&rsquo;s scope, cost, or time. A <b>punch list</b> is the list of small unfinished or damaged items to fix at the end.`},
    {t:"The team", p:`The <b>client</b> owns the project. The <b>architect</b> leads design. A <b>structural engineer</b> designs beams, columns, and foundations. <b>MEP engineers</b> design the mechanical (heating and cooling), electrical, and plumbing systems. A <b>civil engineer</b> handles grading, drainage, and utilities on the site. A <b>general contractor</b> builds it with crews of specialists.`},
    {t:"The road to becoming an architect", p:`Typical steps: <b>1.</b> earn a degree from a program accredited by the <b>NAAB</b> (National Architectural Accrediting Board), either a 5-year Bachelor of Architecture or a bachelor&rsquo;s degree plus a 2&ndash;3 year Master of Architecture. <b>2.</b> log supervised work hours through the <b>AXP</b> (Architectural Experience Program). <b>3.</b> pass the <b>ARE</b> (Architect Registration Examination). <b>4.</b> get licensed by your state. The <b>AIA</b> (American Institute of Architects) is the professional membership organization. Rules vary a bit by state.`}

/* ============================================================
   SCENES: one-point-perspective museum galleries drawn in SVG
   draw(floorIndex, state) where state is "locked", "ready" or "open"
   ============================================================ */
const SCN = (()=>{
  const f=n=>Math.round(n*10)/10, P=(x,y)=>f(x)+","+f(y);
  const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453; return x-Math.floor(x);};
  const BR="#e6c27f", PAPER="#eef1f4", INK="#10161d", HEAD="Josefin Sans,Avenir Next,sans-serif";
  const wall=(side,u,v)=>{const x=side==="L"?u*260:1000-u*260, yt=u*70, yb=320-u*110; return [x,yt+v*(yb-yt)];};
  const poly=(pts,a)=>`<polygon points="${pts.map(p=>P(p[0],p[1])).join(" ")}" ${a||""}/>`;
  const wq=(side,u1,u2,v1,v2,a)=>poly([wall(side,u1,v1),wall(side,u2,v1),wall(side,u2,v2),wall(side,u1,v2)],a);
  const cp=(s,t)=>[500+s*(500-t*260),t*70];
  const fp=(s,t)=>[500+s*(500-t*260),320-t*110];
  const cq=(s1,s2,t1,t2,a)=>poly([cp(s1,t1),cp(s2,t1),cp(s2,t2),cp(s1,t2)],a);
  const fq=(s1,s2,t1,t2,a)=>poly([fp(s1,t1),fp(s2,t1),fp(s2,t2),fp(s1,t2)],a);
  const K=t=>1-t*0.48;
  const ln=(a,b,st,w,op)=>`<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="${st}" stroke-width="${w||1}" ${op?`opacity="${op}"`:""}/>`;
  const rect=(x,y,w,h,a)=>`<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" ${a||""}/>`;
  const txt=(x,y,s,size,fill,a)=>`<text x="${f(x)}" y="${f(y)}" text-anchor="middle" font-family="${HEAD}" font-weight="700" font-size="${size}" fill="${fill}" ${a||""}>${s}</text>`;
  const ell=(x,y,rx,ry,a)=>`<ellipse cx="${f(x)}" cy="${f(y)}" rx="${f(rx)}" ry="${f(ry)}" ${a||""}/>`;
  const shadow=(x,y,rx,ry,op)=>ell(x,y,rx,ry,`fill="#000" opacity="${op||.5}" filter="url(#b5)"`);
  const glow=(x,y,r,op)=>`<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" fill="url(#gWarm)" opacity="${op||.6}"/>`;
  const cone=(x,y0,w0,x1,y1,w1)=>poly([[x-w0,y0],[x+w0,y0],[x1+w1,y1],[x1-w1,y1]],`fill="url(#gCone)" filter="url(#b2)"`);
  const box=(s,t,w,h,side,top)=>{const [x,y]=fp(s,t),k=K(t),W=w*k,H=h*k;
    return shadow(x,y,W*.8,W*.14,.5)+rect(x-W/2,y,W,H*.35,`fill="${side}" opacity=".12" filter="url(#b2)"`)
      +rect(x-W/2,y-H,W,H,`fill="${side}"`)+rect(x-W/2,y-H,W,H,`fill="url(#gShade)"`)
      +rect(x-W/2,y-H,W,Math.max(3,H*.1),`fill="${top}"`)+rect(x-W/2,y-H,W,1.2,`fill="#fff" opacity=".4"`);};

  const defs=c=>`<defs>
    <filter id="b2" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1400" height="800"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="b5" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1400" height="800"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="b12" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1400" height="800"><feGaussianBlur stdDeviation="12"/></filter>
    <linearGradient id="gC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c.ceilA}"/><stop offset="1" stop-color="${c.ceilB}"/></linearGradient>
    <linearGradient id="gW" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${c.wallLo}"/><stop offset=".5" stop-color="${c.wallHi}"/><stop offset="1" stop-color="${c.wallLo}"/></linearGradient>
    <linearGradient id="gWv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".4"/><stop offset=".4" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".06"/></linearGradient>
    <linearGradient id="gL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${c.sideA}"/><stop offset="1" stop-color="${c.sideB}"/></linearGradient>
    <linearGradient id="gR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="${c.sideA}"/><stop offset="1" stop-color="${c.sideB}"/></linearGradient>
    <linearGradient id="gF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c.floorFar}"/><stop offset="1" stop-color="${c.floorNear}"/></linearGradient>
    <radialGradient id="gFR" cx=".5" cy=".05" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="gWarm"><stop offset="0" stop-color="#fff0c8" stop-opacity=".95"/><stop offset=".35" stop-color="#ffc66e" stop-opacity=".45"/><stop offset="1" stop-color="#ff9d3d" stop-opacity="0"/></radialGradient>
    <linearGradient id="gCone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2d0" stop-opacity=".32"/><stop offset="1" stop-color="#fff2d0" stop-opacity="0"/></linearGradient>
    <linearGradient id="gShade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".6" stop-color="#000" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></linearGradient>
    <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f2145"/><stop offset=".55" stop-color="#40608f"/><stop offset="1" stop-color="#f0a45f"/></linearGradient>
    <linearGradient id="gStone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ddd7cb"/><stop offset="1" stop-color="#b3ac9d"/></linearGradient>
    <radialGradient id="gBrass" cx=".38" cy=".35" r=".8"><stop offset="0" stop-color="#fbe8b0"/><stop offset=".55" stop-color="#c8963a"/><stop offset="1" stop-color="#7a5418"/></radialGradient>
    <linearGradient id="gCol" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6d7783"/><stop offset=".3" stop-color="#f1f4f7"/><stop offset=".65" stop-color="#a5afba"/><stop offset="1" stop-color="#555f6b"/></linearGradient>
    <linearGradient id="gSteel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6a7582"/><stop offset=".45" stop-color="#c9d1da"/><stop offset="1" stop-color="#76818e"/></linearGradient>
    <linearGradient id="gGlass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset=".5" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/></linearGradient>
    <linearGradient id="gDoor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6d8"/><stop offset="1" stop-color="#f2a640"/></linearGradient>
    <linearGradient id="gGrade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4f8a" stop-opacity=".16"/><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#ff9d3d" stop-opacity=".1"/></linearGradient>
    <radialGradient id="gVig" cx=".5" cy=".5" r=".78"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient>
  </defs>`;

  function floorMat(kind){
    let o="";
    if(kind==="wood"){
      for(let i=-10;i<10;i++){const s1=i*.1; o+=fq(s1,s1+.1,0,1,`fill="${rnd(i+3)>.5?"#fff":"#000"}" opacity="${f(.03+rnd(i)*.09)}"`)+ln(fp(s1,1),fp(s1,0),"#000",1,.3);}
      for(let i=-10;i<10;i++){const t=rnd(i+40); o+=ln(fp(i*.1,t),fp(i*.1+.1,t),"#000",1,.25);}
    } else {
      const T=[0,.1,.22,.38,.58,.8,1];
      for(let j=0;j<6;j++)for(let i=-5;i<5;i++) o+=fq(i*.2,i*.2+.2,T[j],T[j+1],`fill="${rnd(i*9+j)>.5?"#fff":"#000"}" opacity="${f(.02+rnd(i*5+j+2)*.07)}"`);
      for(let i=-5;i<=5;i++) o+=ln(fp(i*.2,1),fp(i*.2,0),"#000",1,.22);
      T.forEach(t=>{o+=ln(fp(-1,t),fp(1,t),"#000",1,.22);});
      if(kind==="marble") for(let k=0;k<10;k++){const a=fp(-1+rnd(k)*2,rnd(k+20)), b=fp(-1+rnd(k+60)*2,rnd(k+80)); o+=ln(a,b,"#fff",1,.07)+ln([a[0]+14,a[1]+3],[b[0]+10,b[1]-4],"#000",1,.06);}
    }
    return o;
  }

  function shell(c){
    let o=defs(c);
    o+=`<polygon points="0,0 1000,0 740,70 260,70" fill="url(#gC)"/>`;
    [.3,.55,.8].forEach(t=>{o+=ln(cp(-1,t),cp(1,t),"#000",3,.24)+ln(cp(-1,t+.02),cp(1,t+.02),"#fff",1,.07);});
    [-.66,-.33,0,.33,.66].forEach(s=>{o+=ln(cp(s,0),cp(s,1),"#000",1.5,.14);});
    o+=`<polygon points="0,0 260,70 260,210 0,320" fill="url(#gL)"/><polygon points="1000,0 740,70 740,210 1000,320" fill="url(#gR)"/>`;
    for(let i=1;i<9;i++){const u=i/9;["L","R"].forEach(sd=>{const a=wall(sd,u,0),b=wall(sd,u,1),d=sd==="L"?1.2:-1.2; o+=ln(a,b,"#000",1,.16)+ln([a[0]+d,a[1]],[b[0]+d,b[1]],"#fff",1,.05);});}
    o+=rect(260,70,480,140,`fill="url(#gW)"`)+rect(260,70,480,140,`fill="url(#gWv)"`);
    for(let x=308;x<740;x+=48) o+=ln([x,70],[x,210],"#000",1,.12)+ln([x+1.2,70],[x+1.2,210],"#fff",1,.05);
    o+=rect(260,196,480,14,`fill="#000" opacity=".3"`)+rect(260,195,480,1.2,`fill="#fff" opacity=".14"`);
    o+=`<polygon points="0,320 260,210 740,210 1000,320" fill="url(#gF)"/>`+floorMat(c.kind)+`<polygon points="0,320 260,210 740,210 1000,320" fill="url(#gFR)"/>`;
    o+=`<polyline points="0,320 260,210 740,210 1000,320" fill="none" stroke="#000" stroke-width="12" opacity=".4" filter="url(#b5)"/>`;
    o+=`<polyline points="0,0 260,70 740,70 1000,0" fill="none" stroke="#000" stroke-width="12" opacity=".35" filter="url(#b5)"/>`;
    o+=rect(255,70,10,140,`fill="#000" opacity=".4" filter="url(#b5)"`)+rect(735,70,10,140,`fill="#000" opacity=".4" filter="url(#b5)"`);
    if(c.lights){[-.34,.34].forEach(s=>{
      o+=poly([fp(s-.14,.08),fp(s+.14,.08),fp(s+.14,.92),fp(s-.14,.92)],`fill="#ffe2b0" opacity=".1" filter="url(#b12)"`);
      o+=cq(s-.06,s+.06,.06,.94,`fill="#ffd28a" opacity=".6" filter="url(#b5)"`)+cq(s-.028,s+.028,.06,.94,`fill="#fff8e6"`);});}
    return o;
  }
  function keypad(state,kx,ky){
    const led=state==="locked"?"#ff6b5a":"#6fe3a6";
    let o=rect(kx-2,ky-2,26,38,`fill="#000" opacity=".5" filter="url(#b2)"`)+rect(kx,ky,22,34,`fill="url(#gSteel)"`)+rect(kx+2,ky+2,18,30,`fill="#0b121a"`);
    o+=`<circle cx="${kx+11}" cy="${ky+7}" r="8" fill="${led}" opacity=".45" filter="url(#b2)"/><circle cx="${kx+11}" cy="${ky+7}" r="3" fill="${led}"/>`;
    for(let r=0;r<3;r++)for(let c=0;c<3;c++)o+=`<circle cx="${kx+5.5+c*5.5}" cy="${ky+16+r*5.5}" r="1.5" fill="#aab6c4"/>`;
    return o;
  }
  function signBox(x,y,w,label){return rect(x-4,y-4,w+8,23,`fill="#6fe3a6" opacity=".35" filter="url(#b5)"`)+rect(x,y,w,15,`fill="#07110d" stroke="#6fe3a6" stroke-width="1"`)+txt(x+w/2,y+11.2,label,9.5,"#8cf0bd");}
  function stairDoor(state){
    let o=rect(434,102,132,112,`fill="#000" opacity=".45" filter="url(#b5)"`);
    if(state==="open"){
      o+=rect(440,108,120,102,`fill="url(#gDoor)"`);
      for(let i=0;i<7;i++) o+=ln([440,124+i*13],[560,124+i*13],"#9a5a10",2,.45);
      o+=rect(440,108,20,102,`fill="#4a5360"`)+rect(540,108,20,102,`fill="#4a5360"`);
      o+=poly([[430,210],[570,210],[690,320],[310,320]],`fill="#ffd28a" opacity=".3" filter="url(#b5)"`)+glow(500,170,110,.55);
    } else {
      o+=rect(440,108,120,102,`fill="url(#gSteel)"`)+rect(440,108,120,102,`fill="url(#gShade)" opacity=".5"`);
      o+=rect(452,118,36,44,`fill="#0b1724"`)+rect(512,118,36,44,`fill="#0b1724"`)+rect(452,118,36,44,`fill="url(#gGlass)"`)+rect(512,118,36,44,`fill="url(#gGlass)"`);
      o+=ln([500,108],[500,210],"#1b222b",2)+rect(440,196,120,14,`fill="#000" opacity=".25"`);
      o+=rect(488,150,4,26,`fill="#e9eef3"`)+rect(508,150,4,26,`fill="#e9eef3"`)+`<rect x="440" y="108" width="120" height="102" fill="none" stroke="#10161d" stroke-width="4"/>`;
    }
    return o+signBox(455,86,90,"STAIRS &#9660;")+keypad(state,578,140);
  }
  function glassDoors(state){
    let o=rect(388,96,224,118,`fill="#000" opacity=".45" filter="url(#b5)"`)+rect(395,100,210,110,`fill="#10161d"`);
    o+=rect(400,105,200,105,`fill="url(#gSky)"`);
    for(let i=0;i<9;i++){const x=402+i*22,h2=22+rnd(i)*34; o+=rect(x,190-h2,18,h2,`fill="#0a111b"`); for(let k=0;k<3;k++) if(rnd(i*3+k)>.4) o+=rect(x+4+(k%2)*6,190-h2+5+k*9,3,4,`fill="#ffcf82" opacity=".9"`);}
    o+=rect(400,190,200,20,`fill="#1c2733"`)+rect(400,190,200,2,`fill="#ffcf82" opacity=".35"`);
    o+=glow(450,150,34,.7)+ln([450,205],[450,136],"#06101f",3)+`<circle cx="450" cy="134" r="4.5" fill="#fff0c0"/>`+rect(420,196,60,12,`fill="#ffcf82" opacity=".16" filter="url(#b2)"`);
    if(state==="open"){
      o+=rect(400,105,26,105,`fill="url(#gGlass)" stroke="#10161d" stroke-width="3"`)+rect(574,105,26,105,`fill="url(#gGlass)" stroke="#10161d" stroke-width="3"`);
      o+=poly([[400,214],[600,214],[740,320],[260,320]],`fill="#9fc0ff" opacity=".2" filter="url(#b5)"`);
    } else {
      o+=rect(400,105,98,105,`fill="url(#gGlass)" stroke="#10161d" stroke-width="3"`)+rect(502,105,98,105,`fill="url(#gGlass)" stroke="#10161d" stroke-width="3"`);
      o+=rect(487,150,4,26,`fill="#e9eef3"`)+rect(509,150,4,26,`fill="#e9eef3"`);
      o+=poly([[400,214],[600,214],[700,320],[300,320]],`fill="#8fb0e8" opacity=".1" filter="url(#b5)"`);
    }
    return o+signBox(470,80,60,"EXIT")+keypad(state,620,140);
  }
  const column=(s,t)=>{const [x,y]=fp(s,t),k=K(t),w=24*k,h=118*k;
    let o=shadow(x,y,w*1.2,w*.22,.5)+rect(x-w/2,y+2,w,h*.3,`fill="url(#gCol)" opacity=".13" filter="url(#b2)"`);
    o+=rect(x-w*.7,y-6*k,w*1.4,6*k,`fill="#9aa5b1"`)+rect(x-w/2,y-h,w,h-6*k,`fill="url(#gCol)"`);
    for(let i=1;i<5;i++) o+=ln([x-w/2+i*w/5,y-h],[x-w/2+i*w/5,y-6*k],"#000",1,.1);
    return o+rect(x-w*.75,y-h-8*k,w*1.5,8*k,`fill="#e6ebf0"`)+rect(x-w*.75,y-h-8*k,w*1.5,1.5,`fill="#fff" opacity=".6"`);};

  /* floor 5 */
  function art5(){
    let o=cq(-.72,.72,.1,.95,`fill="url(#gSky)"`)+ell(500,34,130,9,`fill="#ffb878" opacity=".5" filter="url(#b5)"`);
    [-.36,0,.36].forEach(s=>{o+=ln(cp(s,.1),cp(s,.95),"#0c1218",3,.95)+ln(cp(s+.01,.1),cp(s+.01,.95),"#fff",1,.2);});
    [.4,.68].forEach(t=>{o+=ln(cp(-.72,t),cp(.72,t),"#0c1218",3,.95);});
    o+=cq(-.72,.72,.1,.95,`fill="none" stroke="#0c1218" stroke-width="4"`);
    for(let i=0;i<26;i++){const p=cp(-.7+rnd(i)*1.4,.12+rnd(i+50)*.8); o+=`<line class="rain" style="animation-delay:${f(rnd(i+9)*1.4)}s" x1="${f(p[0])}" y1="${f(p[1])}" x2="${f(p[0]-3)}" y2="${f(p[1]+6)}" stroke="#d7e8fb" stroke-width="1.2"/>`;}
    o+=fq(-.98,-.55,.1,.62,`fill="#ffb067" opacity=".16" filter="url(#b12)"`)+fq(.55,.98,.1,.62,`fill="#ffb067" opacity=".16" filter="url(#b12)"`);
    ["L","R"].forEach((sd,j)=>{
      o+=wq(sd,.1,.58,.12,.78,`fill="url(#gSky)"`);
      for(let i=0;i<6;i++){const u1=.1+i*.08,vt=.38+rnd(i+j*9)*.3; o+=wq(sd,u1,u1+.065,vt,.78,`fill="#070d16"`);
        for(let k=0;k<3;k++){const v=vt+.05+k*.09; if(v+.04<.76&&rnd(i*7+k+j)>.35) o+=wq(sd,u1+.012,u1+.026,v,v+.035,`fill="#ffcf82" opacity=".9"`);}}
      o+=wq(sd,.1,.34,.12,.78,`fill="#fff" opacity=".06"`)+wq(sd,.1,.58,.12,.78,`fill="none" stroke="#10161d" stroke-width="3.5"`)+wq(sd,.335,.345,.12,.78,`fill="#10161d"`)+wq(sd,.1,.58,.44,.45,`fill="#10161d"`);
    });
    const tab=(x,y,w,t)=>rect(x+3,y+4,w,34,`fill="#000" opacity=".5" filter="url(#b2)"`)+rect(x,y,w,34,`fill="url(#gStone)"`)+rect(x,y,w,1.5,`fill="#fff" opacity=".6"`)+txt(x+w/2+.7,y+20.7,t,9.5,"#fff",'opacity=".6"')+txt(x+w/2,y+20,t,9.5,"#3b4048");
    o+=tab(280,98,70,"FIRMITAS")+tab(360,98,70,"UTILITAS")+tab(616,98,74,"VENUSTAS");
    o+=shadow(693,172,22,6,.4)+`<circle cx="690" cy="168" r="19" fill="url(#gBrass)"/><circle cx="690" cy="168" r="13" fill="none" stroke="#6a4812" stroke-width="1" opacity=".7"/>`;
    for(let i=0;i<12;i++){const a=i*Math.PI/6; o+=ln([690+15*Math.cos(a),168+15*Math.sin(a)],[690+19*Math.cos(a),168+19*Math.sin(a)],"#6a4812",1.2);}
    o+=txt(690,173,"3",14,"#5a3c0c");
    o+=rect(282,148,148,34,`fill="#000" opacity=".45" filter="url(#b2)"`)+rect(282,148,148,34,`fill="#0a121b" stroke="#2a3644" stroke-width="1.5"`)+rect(282,148,148,34,`fill="url(#gGlass)"`)+txt(356,159,"WHO&rsquo;S WHO",8,"#ffd9a0");
    for(let i=0;i<3;i++) o+=ln([292,166+i*5],[330+i*18,166+i*5],"#9db9d2",1.6,.8)+ln([380,166+i*5],[418,166+i*5],"#9db9d2",1.6,.6);
    return o+column(-.62,.5)+column(.62,.5);
  }
  /* floor 4 */
  function portrait(sd,u1,u2,i){
    let o=wq(sd,u1-.025,u2+.025,.1,.84,`fill="#ffd9a0" opacity=".14" filter="url(#b5)"`);
    const [sx0,sy0]=wall(sd,(u1+u2)/2,.2);
    o+=cone(sx0,wall(sd,(u1+u2)/2,0)[1],4,sx0,sy0+4,26);
    o+=wq(sd,u1,u2,.2,.74,`fill="#2b1d14"`)+wq(sd,u1+.008,u2-.008,.22,.72,`fill="${BR}"`)+wq(sd,u1+.016,u2-.016,.235,.705,`fill="#16243b"`);
    const um=(u1+u2)/2,[cx,cy]=wall(sd,um,.4),a=wall(sd,u1,.24),b=wall(sd,u2,.24),w=Math.abs(b[0]-a[0]),hh=wall(sd,um,.7)[1]-wall(sd,um,.24)[1];
    const tones=["#e8c9a0","#c79b7a","#f0d8b8","#a97c5a"];
    o+=ell(cx,cy,w*.2,hh*.13,`fill="${tones[i%4]}"`)+ell(cx-w*.04,cy-hh*.03,w*.06,hh*.04,`fill="#fff" opacity=".25"`);
    const [sx,sy]=wall(sd,um,.62);
    o+=ell(sx,sy,w*.34,hh*.075,`fill="#3d5a80"`)+wq(sd,u1+.016,u2-.016,.235,.705,`fill="url(#gGlass)"`);
    return o;
  }
  function elev(x,y,w,h,n){

function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k==="class") e.className = v;
    else if(k==="html") e.innerHTML = v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if(v!==false && v!==null && v!==undefined) e.setAttribute(k, v===true?"":v);
  }
  kids.flat().forEach(c=>{ if(c==null||c===false) return; e.append(c.nodeType ? c : document.createTextNode(/&#?\w+;/.test(c) ? decode(String(c)) : c)); });
  return e;
}
const decode = s => { const t=document.createElement("textarea"); t.innerHTML=s; return t.value; };
const norm = s => decode(String(s)).toLowerCase().replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim().replace(/^(the|a|an)\s+/,"");
function numval(s){
  s = String(s).toLowerCase().replace(/,/g,"").replace(/\b(feet|foot|ft|inches|inch|in|sq|square)\b/g," ").replace(/["'”’′″]/g," ").replace(/\s+/g," ").trim();
  let m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/); if(m) return +m[1] + (+m[2])/(+m[3]);
  m = s.match(/^(\d+)\/(\d+)$/); if(m) return (+m[1])/(+m[2]);
  return /^\d*\.?\d+$/.test(s) ? parseFloat(s) : NaN;
}
const fmt = ms => { const s=Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); };
const elapsed = () => (S.end||Date.now()) - S.start;
const hintTotal = () => Object.values(S.hints).reduce((a,b)=>a+b,0);

/* puzzle input types: each returns {el, check()} */
const TYPES = {
  multi(p){
    const inputs = p.fields.map(f=>h("input",{type:"text",autocomplete:"off",autocapitalize:"off",spellcheck:"false",placeholder:f.ph||"Your answer","aria-label":decode(f.label).replace(/\s+/g," ")}));
    const rows = p.fields.map((f,k)=>h("label",{class:"frow"},h("span",{html:f.label}),inputs[k]));
    return {el:h("div",{},rows), check(){
      let n=0;
      p.fields.forEach((f,k)=>{
        const v = inputs[k].value;
        const ok = f.num!==undefined ? Math.abs(numval(v)-f.num)<1e-9 : f.answers.some(a=>norm(a)===norm(v));
        inputs[k].classList.toggle("ok",ok); inputs[k].classList.toggle("no",!ok && v.trim()!=="");
        if(ok) n++;
      });
      return n===p.fields.length ? {ok:true,msg:"Every answer is correct."} : {ok:false,msg:`${n} of ${p.fields.length} answers correct. Fix the ones outlined in red.`};
    }};
  },
  order(p){
    const arr = p.start.slice();
    const list = h("ol",{class:"orderlist"});
    const draw = () => list.replaceChildren(...arr.map((idx,pos)=>h("li",{},
      h("span",{class:"otext",html:p.items[idx]}),
      h("span",{class:"obtns"},
        h("button",{class:"mini",type:"button","aria-label":"Move up",disabled:pos===0,onclick:()=>{[arr[pos-1],arr[pos]]=[arr[pos],arr[pos-1]];draw();}},"▲"),
        h("button",{class:"mini",type:"button","aria-label":"Move down",disabled:pos===arr.length-1,onclick:()=>{[arr[pos+1],arr[pos]]=[arr[pos],arr[pos+1]];draw();}},"▼")
      ))));
    draw();
    return {el:list, check(){
      const c = arr.filter((idx,pos)=>idx===pos).length;
      return c===arr.length ? {ok:true,msg:"Perfect order."} : {ok:false,msg:`${c} of ${arr.length} are in the right place.`};
    }};
  },
  match(p){
    const opts = [...p.options].sort((a,b)=>norm(a).localeCompare(norm(b)));
    const sels = p.pairs.map(()=>h("select",{},h("option",{value:""},"Choose…"),opts.map(o=>h("option",{value:decode(o),html:o}))));
    const rows = p.pairs.map((pr,k)=>h("label",{class:"mrow"},h("span",{html:pr[0]}),sels[k]));
    return {el:h("div",{},rows), check(){
      const c = p.pairs.filter((pr,k)=>sels[k].value===decode(pr[1])).length;
      return c===p.pairs.length ? {ok:true,msg:"All matches are correct."} : {ok:false,msg:`${c} of ${p.pairs.length} matches are correct.`};
    }};
  },
  pick(p){
    const boxes = p.options.map(()=>h("input",{type:"checkbox"}));
    const rows = p.options.map((o,k)=>h("label",{class:"pickrow"},boxes[k],h("span",{html:o})));
    return {el:h("div",{},rows), check(){
      const sel = boxes.map((b,k)=>b.checked?k:-1).filter(k=>k>=0);
      const ok = sel.length===p.correct.length && p.correct.every(k=>sel.includes(k));
      return ok ? {ok:true,msg:"Both impostors found."} : {ok:false,msg: sel.length!==p.correct.length ? `Select exactly ${p.correct.length} names.` : "Not quite. Check each person's job."};
    }};
  }
};

function solvedCard(p, num){
  return h("article",{class:"puzzle solved"},
    h("div",{class:"ph"}, h("h3",{},p.title), h("span",{class:"digit"},`Digit #${num}: ${p.digit}`)),
    h("div",{class:"reveal",html:p.reveal}));
}

function activeCard(p, num, total, onSolved){
  const card = h("article",{class:"puzzle"});
  const ui = TYPES[p.type](p);
  const status = h("div",{class:"msg",role:"status","aria-live":"polite"});
  const hintBox = h("div",{class:"hints"});
  const hintBtn = h("button",{class:"btn ghost",type:"button"});
  const drawHints = () => {
    const n = S.hints[p.id]||0;
    hintBox.replaceChildren(...p.hints.slice(0,n).map((t,k)=>h("p",{class:"hint"},h("b",{},`Hint ${k+1}: `),h("span",{html:t}))));
    hintBtn.textContent = n>=p.hints.length ? "No more hints" : `Need a hint? (${n}/${p.hints.length} used)`;
    hintBtn.disabled = n>=p.hints.length;
  };
  hintBtn.addEventListener("click",()=>{
    const n = S.hints[p.id]||0;
    if(n<p.hints.length){ S.hints[p.id]=n+1; save(); drawHints(); const c=document.getElementById("hintcount"); if(c) c.textContent=hintTotal(); }
  });
  const checkBtn = h("button",{class:"btn",type:"button",onclick:()=>{
    const r = ui.check();
    status.className = "msg "+(r.ok?"good":"bad"); status.textContent = r.msg;
    if(r.ok){ S.solved[p.id]=true; save(); setTimeout(()=>onSolved(card),450); }
  }},"Check answer");
  card.append(
    h("div",{class:"ph"}, h("h3",{},p.title), total?h("span",{class:"pn"},`Puzzle ${num} of ${total}`):null),
    h("div",{class:"prompt",html:p.prompt}),
    ui.el,
    h("div",{class:"actions"},checkBtn,hintBtn),
    status, hintBox
  );
  drawHints();
  return card;
}

function roomScreen(){

    h("ul",{class:"tasklist"}, R.puzzles.map((p,i)=>{

      sceneEl(4,"open","The street"),
      h("h1",{style:"margin-top:22px"},"You escaped!"),
      h("p",{class:"story"},"The front doors swing open and cool night air rushes in. You made it down five floors by thinking like architects."),
      h("div",{class:"cert"},
        h("h2",{},"Certificate of escape"),
        h("p",{},"This certifies that the team"),
        h("div",{class:"big"},S.team),
        h("p",{},`escaped the ${MUSEUM} in`),
        h("div",{class:"big"},fmt(elapsed())),
        h("p",{},`using ${hints} hint${hints===1?"":"s"}, earning the rank of`),
        h("div",{class:"big"},rank)),
      h("button",{class:"btn",type:"button",onclick:()=>window.print()},"Print certificate"),
      h("div",{class:"panel",style:"margin-top:26px"},
        h("h3",{},"What you just practiced"),
        h("ul",{class:"rules"},
          ...ROOMS.map((r,i)=>h("li",{},h("b",{},`Floor ${r.floor}: `),FACULTY[i][1])))),
      h("div",{class:"panel"},
        h("h3",{},"Could this be your career?"),
        h("p",{},"Architects mix creativity, math, drawing, teamwork, and communication. If you enjoyed the puzzles, you already used many of the skills they use every day."),
        h("p",{html:`The path usually includes an accredited degree, supervised work experience, and a licensing exam. To learn more, explore <a href="https://www.aia.org" target="_blank" rel="noopener">the American Institute of Architects</a> and <a href="https://www.ncarb.org" target="_blank" rel="noopener">NCARB</a>.`})),
      h("div",{class:"panel"},
        h("h3",{},"Talk it over with your team"),
        h("ul",{class:"rules"},
          h("li",{},"Which puzzle felt most like real design work? Why?"),
          h("li",{},"Which architect or building would you like to learn more about?"),
          h("li",{},"What building in your own town would you redesign, and what problem would you solve?"))),
      h("button",{class:"btn ghost",type:"button",onclick:()=>{S=fresh();save();render();}},"Play again")
    )));
}

function render(){
  let el;
  if(S.screen!=="room"){ S.puzzle=null; if(location.hash){ try{history.replaceState(null,"",location.pathname+location.search);}catch(e){} } }
  switch(S.screen){
    case "room": el = (S.puzzle!==null && S.puzzle!==undefined) ? puzzleScreen() : roomScreen(); break;
    case "transition": el = transitionScreen(); break;
    case "exit": el = exitScreen(); break;
    case "win": el = winScreen(); break;
    default: el = startScreen();
  }
  app.replaceChildren(el);
}

S.puzzle = syncFromHash();
setInterval(()=>{
  const t = document.getElementById("timer");
  if(t && S.start && !S.end){
    const e = elapsed(); t.textContent = fmt(e);
    const late = e >= TARGET_MIN*60000;
    t.classList.toggle("late",late);
    const b = document.getElementById("late"); if(b) b.hidden = !late;
  }
},1000);

render();
</script>
